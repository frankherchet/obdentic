[package]
name = "obdentic"
default-run = "obdentic"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"

[dependencies]
btleplug = "=0.12.0"
futures-util = "=0.3.32"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29"] }
tokio = { version = "=1.50.0", features = ["macros", "rt-multi-thread", "time", "signal"] }
