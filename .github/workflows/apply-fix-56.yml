name: Apply issue 56 fix

on:
  push:
    branches:
      - fix/56-elm-protocol-negotiation

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust 1.98.0
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Apply deterministic patch
        run: python3 scripts/apply_fix_56.py
      - name: Format
        run: cargo +1.98.0 fmt
      - name: Test
        run: cargo +1.98.0 test --locked
      - name: Clippy
        run: cargo +1.98.0 clippy --all-targets --locked -- -D warnings
      - name: Build
        run: cargo +1.98.0 build --locked
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git config user.name "openai-codex[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ble.rs src/capture_events.rs src/jsonl_capture.rs src/capture_report.rs src/main.rs tests/m2_6_acceptance.rs
          git commit -m "Separate ELM protocol negotiation from DTC jobs"
          git push origin HEAD:fix/56-elm-protocol-negotiation
