name: Issue 121 effective Knowledge bootstrap r4

on:
  push:
    branches:
      - feature/121-effective-knowledge-v2-r3

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Load previously validated patch logic
        run: |
          git fetch origin feature/121-effective-knowledge-v2:refs/remotes/origin/feature/121-effective-knowledge-v2
          git show origin/feature/121-effective-knowledge-v2:tools/issue121_effective_knowledge_patch.py > /tmp/issue121_effective_knowledge_patch.py
      - name: Update pinned Knowledge submodule
        run: |
          git -C knowledge fetch origin main
          git -C knowledge checkout --detach b356ff5afb850017ec546945f41d739071c74d76
      - name: Apply effective Knowledge slice
        run: python3 /tmp/issue121_effective_knowledge_patch.py
      - name: Update ECU-identification provenance freeze
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/ecu_identification.rs')
          text = path.read_text(encoding='utf-8')
          marker = 'fn plan_retains_exact_knowledge_provenance_and_is_deterministic()'
          if text.count(marker) != 1:
              raise SystemExit(f'expected exactly one provenance test marker, found {text.count(marker)}')
          prefix, suffix = text.split(marker, 1)
          old_revision = '661fba8eed8ddce8fef5bba4c68dfcba85e2dd28'
          if suffix.count(old_revision) != 1:
              raise SystemExit(f'expected exactly one old revision in provenance test, found {suffix.count(old_revision)}')
          if suffix.count('first.knowledge_schema_version(), 1') != 1:
              raise SystemExit('expected exactly one schema-v1 assertion in provenance test')
          suffix = suffix.replace(old_revision, 'b356ff5afb850017ec546945f41d739071c74d76', 1)
          suffix = suffix.replace('first.knowledge_schema_version(), 1', 'first.knowledge_schema_version(), 2', 1)
          path.write_text(prefix + marker + suffix, encoding='utf-8')
          PY
      - run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.98.0 fmt
      - run: cargo +1.98.0 test --locked
      - run: cargo +1.98.0 clippy --all-targets --locked -- -D warnings
      - run: cargo +1.98.0 build --locked
      - name: Commit validated product changes
        run: |
          git add knowledge knowledge.lock src/knowledge_db.rs src/effective_knowledge.rs src/ecu_identification.rs src/lib.rs tests/knowledge_db.rs tests/effective_knowledge.rs docs/effective-knowledge.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Resolve effective Vehicle Knowledge from schema v2'
          git push origin HEAD:feature/121-effective-knowledge-v2-r3
