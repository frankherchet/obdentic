name: Issue 121 effective Knowledge bootstrap

on:
  push:
    branches:
      - feature/121-effective-knowledge-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Update pinned Knowledge submodule
        run: |
          git -C knowledge fetch origin main
          git -C knowledge checkout --detach b356ff5afb850017ec546945f41d739071c74d76
      - run: python3 tools/issue121_effective_knowledge_patch.py
      - run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.98.0 fmt
      - run: cargo +1.98.0 test --locked
      - run: cargo +1.98.0 clippy --all-targets --locked -- -D warnings
      - run: cargo +1.98.0 build --locked
      - name: Commit validated product changes
        run: |
          git add knowledge knowledge.lock src/knowledge_db.rs src/effective_knowledge.rs src/lib.rs tests/knowledge_db.rs tests/effective_knowledge.rs docs/effective-knowledge.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Resolve effective Vehicle Knowledge from schema v2'
          git push origin HEAD:feature/121-effective-knowledge-v2
