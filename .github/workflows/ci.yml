name: CI

# One run per PR push (pull_request) and per merge to main (push). Tags and
# feature-branch pushes do not start a second identical run.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same PR cancels the superseded run; main runs always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One stable required check that always runs: a documentation-only PR must not carry a skipped
  # job or check (xp-ship never merges with one). Docs, memos and requirements-only changes skip
  # only the expensive Rust *steps*; the gate script and the classifier are tested first. Change
  # detection that fails fails the job, and any output other than exactly 'false' runs the Rust steps.
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Test CI gate script
        run: tools/test-ci-gate.sh
      # REQ-056: the requirements file is checked on every run, also when the Rust steps skip.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.9.8"
      - name: Test requirements check
        run: tools/test-check-requirements.sh
      - name: Validate requirements
        run: uv run --script tools/check-requirements.py
      - name: Detect code changes
        id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          code="$(tools/ci-gate.sh detect "$BASE" "$GITHUB_SHA")"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code changes: $code"
      - name: Verify pinned Knowledge DB revision
        if: steps.diff.outputs.code != 'false'
        run: |
          expected="$(sed -n 's/^revision = //p' knowledge.lock)"
          actual="$(git -C knowledge rev-parse HEAD)"
          test -n "$expected"
          test "$actual" = "$expected"
      - if: steps.diff.outputs.code != 'false'
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - if: steps.diff.outputs.code != 'false'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Cache only main's state; PRs restore it read-only to avoid cache churn.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: steps.diff.outputs.code != 'false'
        run: cargo +1.98.0 fmt --check
      - if: steps.diff.outputs.code != 'false'
        run: cargo +1.98.0 test --locked
      - if: steps.diff.outputs.code != 'false'
        run: cargo +1.98.0 clippy --all-targets --locked -- -D warnings
      - if: steps.diff.outputs.code != 'false'
        run: cargo +1.98.0 build --locked
