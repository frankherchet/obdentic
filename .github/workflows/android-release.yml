name: Android release

# Only version tags. No pull_request, branch push or manual trigger, so signing
# and Firebase secrets are never reachable from PRs, forks or untagged commits.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  checks: read

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out (full history for the ancestry check)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify tag format
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Step 'Verify tag format' failed: tag '$GITHUB_REF_NAME' is not vX.Y.Z. Nothing was signed or distributed."
            exit 1
          fi

      - name: Verify the tagged commit is on main and CI passed
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Step 'Verify the tagged commit is on main' failed: $GITHUB_SHA is not on main. Nothing was signed or distributed."
            exit 1
          fi
          ok="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "check" and .conclusion == "success")] | length')"
          if [[ "$ok" -lt 1 ]]; then
            echo "::error::Step 'Verify CI passed' failed: no successful CI check for $GITHUB_SHA (missing, running or failed). Nothing was signed or distributed; re-run once CI is green."
            exit 1
          fi

      - name: Check required secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          missing=()
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS \
                   ANDROID_KEY_PASSWORD FIREBASE_SERVICE_ACCOUNT_JSON FIREBASE_APP_ID; do
            [[ -n "${!v}" ]] || missing+=("$v")
          done
          if ((${#missing[@]})); then
            echo "::error::Step 'Check required secrets' failed: missing or empty: ${missing[*]}. Nothing was signed or distributed."
            exit 1
          fi

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Rust 1.98.0 with the Android target
        run: rustup toolchain install 1.98.0 --profile minimal --target aarch64-linux-android

      - name: Install Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --licenses < <(yes) > /dev/null
          "$sdkmanager" "ndk;27.2.12479018" "platforms;android-36" "build-tools;35.0.0" > /dev/null

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          base64 -d <<<"$ANDROID_KEYSTORE_BASE64" > "$RUNNER_TEMP/release.jks"
          echo "OBDENTIC_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          OBDENTIC_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OBDENTIC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OBDENTIC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # The runner image presets ANDROID_NDK_HOME to its default NDK; pin the documented one.
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          ./android/gradlew -p android --no-daemon :app:assembleRelease \
            "-PobdenticVersionName=${GITHUB_REF_NAME#v}" \
            "-PobdenticVersionCode=${{ github.run_number }}"

      - name: Verify release APK (signature, permissions, contents)
        run: tools/verify-release-apk.sh android/app/build/outputs/apk/release/app-release.apk

      - name: Distribute through Firebase App Distribution
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TESTER_GROUP: ${{ vars.FIREBASE_TESTER_GROUP }}
        run: |
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json" \
            npx --yes firebase-tools@15.34.1 appdistribution:distribute \
              android/app/build/outputs/apk/release/app-release.apk \
              --app "$FIREBASE_APP_ID" \
              --groups "${FIREBASE_TESTER_GROUP:-testers}" \
              --release-notes "$GITHUB_REF_NAME (${GITHUB_SHA:0:7})"

      - name: Remove signing and Firebase material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/firebase-sa.json"
