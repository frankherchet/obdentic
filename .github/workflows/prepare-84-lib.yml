name: prepare-84-lib

on:
  push:
    branches: [feature/84-pinned-knowledge-loader]

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, 'Integrate Knowledge DB module declaration') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/84-pinned-knowledge-loader
          submodules: recursive
          fetch-depth: 0
      - run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Integrate module declaration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/lib.rs')
          text = path.read_text()
          if 'pub mod knowledge_db;\n' not in text:
              marker = 'pub mod jsonl_capture;\n'
              if marker not in text:
                  raise SystemExit('lib.rs insertion marker not found')
              path.write_text(text.replace(marker, marker + 'pub mod knowledge_db;\n', 1))
          PY
      - run: cargo +1.98.0 fmt --all
      - run: cargo +1.98.0 test --locked
      - run: cargo +1.98.0 clippy --all-targets --locked -- -D warnings
      - run: cargo +1.98.0 build --locked
      - name: Commit module declaration
        run: |
          if git diff --quiet; then
            echo "No module integration change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib.rs
          git commit -m "Integrate Knowledge DB module declaration"
          git push origin HEAD:feature/84-pinned-knowledge-loader
