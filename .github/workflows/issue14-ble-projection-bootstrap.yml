name: Issue 14 BLE evidence projection bootstrap

on:
  push:
    branches:
      - feature/14-ea189-dpf-longitudinal

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add temporary BLE evidence projection gate'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/14-ea189-dpf-longitudinal
          fetch-depth: 0
          submodules: recursive
      - name: Keep elm.rs owned by parallel PR 104
        run: git checkout origin/main -- src/elm.rs
      - run: python3 tools/issue14_ble_evidence_projection.py
      - run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.98.0 fmt
      - run: cargo +1.98.0 test --locked
      - run: cargo +1.98.0 clippy --all-targets --locked -- -D warnings
      - run: cargo +1.98.0 build --locked
      - name: Commit validated product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src docs
          git diff --cached --exit-code && { echo 'projection produced no product changes'; exit 1; } || true
          git commit -m 'Keep longitudinal evidence projection above ELM'
          git push origin HEAD:feature/14-ea189-dpf-longitudinal
