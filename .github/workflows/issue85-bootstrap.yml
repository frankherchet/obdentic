name: Issue 85 bootstrap

on:
  push:
    branches:
      - feature/85-live-ecu-identification

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Bootstrap issue 85 live patch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/85-live-ecu-identification
          fetch-depth: 0
          submodules: recursive
      - name: Make the real session-actor anchor explicit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/issue85_live_patch.py')
          text = path.read_text()
          old = '''    count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement anchor, found {count}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1))
          '''
          # Preserve strict one-anchor behavior everywhere except the one
          # intentionally duplicated SessionCommand arm: the production actor
          # precedes the test actor in ble.rs, so replace the first occurrence.
          new = '''    count = text.count(old)
              if count != 1:
                  if (
                      path == "src/ble.rs"
                      and old == "            SessionCommand::ReadStoredDtcs { reply } => {"
                      and count == 2
                  ):
                      file.write_text(text.replace(old, new, 1))
                      return
                  raise SystemExit(f"{path}: expected one replacement anchor, found {count}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1))
          '''
          if text.count(old) != 1:
              raise SystemExit('bootstrap helper anchor changed unexpectedly')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: python3 tools/issue85_live_patch.py
      - run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.98.0 fmt
      - run: cargo +1.98.0 test --locked
      - run: cargo +1.98.0 clippy --all-targets --locked -- -D warnings
      - run: cargo +1.98.0 build --locked
      - name: Commit generated source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          git diff --cached --exit-code && { echo 'patch produced no changes'; exit 1; } || true
          git commit -m 'Add live bounded ECU identification path'
          git push origin HEAD:feature/85-live-ecu-identification
