name: MF4 asammdf acceptance

on:
  push:
    branches:
      - issue-1-mf4-writer-plugin

permissions:
  contents: read

jobs:
  interoperability:
    if: ${{ github.event.head_commit.message == 'Run external MF4 compatibility check' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Preserve the MF4 smoke-test artifact
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/mf4_capture.rs')
          text = path.read_text()
          needle = '        let _ = std::fs::remove_file(path);'
          replacement = '        println!("MF4_PATH={}", path.display());'
          if needle not in text:
              raise SystemExit('MF4 cleanup line not found')
          path.write_text(text.replace(needle, replacement, 1))
          PY
      - name: Create OBDentic MF4 sample
        run: |
          cargo +1.98.0 test --locked writes_a_parseable_mf4_with_true_read_time_and_diagnostic_evidence -- --nocapture | tee /tmp/obdentic-mf4-test.log
          path="$(sed -n 's/^MF4_PATH=//p' /tmp/obdentic-mf4-test.log | tail -1)"
          test -n "$path"
          test -f "$path"
          printf '%s\n' "$path" > /tmp/obdentic-mf4-path
      - name: Open and inspect with independent asammdf
        run: |
          python3 -m pip install --disable-pip-version-check 'asammdf==8.8.26'
          python3 - "$(cat /tmp/obdentic-mf4-path)" <<'PY'
          import sys
          from collections import defaultdict
          from asammdf import MDF

          path = sys.argv[1]
          mdf = MDF(path)
          assert len(mdf.groups) == 1
          assert 'decoded_numeric_value' in mdf.channels_db
          assert 'evidence_chunk' in mdf.channels_db

          numeric = mdf.get('decoded_numeric_value').samples
          assert any(abs(float(value) - 2000.0) < 1e-9 for value in numeric)

          sequences = mdf.get('event_sequence').samples
          field_kinds = mdf.get('evidence_field_kind').samples
          item_indices = mdf.get('evidence_item_index').samples
          chunk_indices = mdf.get('evidence_chunk_index').samples
          chunk_lengths = mdf.get('evidence_chunk_len').samples
          chunks = mdf.get('evidence_chunk').samples

          fields = defaultdict(list)
          for sequence, field_kind, item_index, chunk_index, chunk_len, chunk in zip(
              sequences,
              field_kinds,
              item_indices,
              chunk_indices,
              chunk_lengths,
              chunks,
          ):
              length = int(chunk_len)
              if length == 0:
                  continue
              raw = chunk.tobytes() if hasattr(chunk, 'tobytes') else bytes(chunk)
              fields[(int(sequence), int(field_kind), int(item_index))].append(
                  (int(chunk_index), raw[:length])
              )

          def assemble(key):
              return b''.join(part for _, part in sorted(fields[key]))

          assert assemble((1, 3, 0)) == bytes([0x01, 0x0C])
          assert assemble((1, 4, 0)) == bytes([0x41, 0x0C, 0x1F, 0x40])
          mdf.close()
          print('asammdf acceptance: ok')
          PY
