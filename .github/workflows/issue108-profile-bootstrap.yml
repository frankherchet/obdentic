name: Issue 108 profile bootstrap

on:
  push:
    branches:
      - feature/108-yaml-engine-drive

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: python3 tools/issue108_profile_fix.py
      - run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.98.0 fmt
      - run: cargo +1.98.0 test --locked
      - run: cargo +1.98.0 clippy --all-targets --locked -- -D warnings
      - run: cargo +1.98.0 build --locked
      - name: Commit validated source changes
        run: |
          git add src/capture.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix YAML capture profile validation'
          git push origin HEAD:feature/108-yaml-engine-drive
