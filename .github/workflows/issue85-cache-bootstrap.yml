name: Issue 85 cache bootstrap

on:
  push:
    branches:
      - feature/85-ecu-identification-cache

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Bootstrap issue 85 cache model patch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/85-ecu-identification-cache
          fetch-depth: 0
          submodules: recursive
      - name: Tighten cache patch anchors and revision validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/issue85_cache_patch.py')
          text = path.read_text()
          old = '''replace_once(
              "src/vehicle_cache.rs",
              "    target_mappings: Vec<TargetMappingSnapshot>,\\n}",
              "    target_mappings: Vec<TargetMappingSnapshot>,\\n    ecu_identification: Vec<IdentificationObservation>,\\n}",
          )'''
          new = '''replace_once(
              "src/vehicle_cache.rs",
              "pub struct VehicleCacheSnapshot {\\n    topology: Vec<TopologyObservation>,\\n    ecu_capabilities: Vec<EcuCapabilitySnapshot>,\\n    target_mappings: Vec<TargetMappingSnapshot>,\\n}",
              "pub struct VehicleCacheSnapshot {\\n    topology: Vec<TopologyObservation>,\\n    ecu_capabilities: Vec<EcuCapabilitySnapshot>,\\n    target_mappings: Vec<TargetMappingSnapshot>,\\n    ecu_identification: Vec<IdentificationObservation>,\\n}",
          )'''
          if text.count(old) != 1:
              raise SystemExit('cache helper snapshot anchor changed unexpectedly')
          text = text.replace(old, new, 1)
          old_validation = '        validate_text(\\"identification knowledge revision\\", observation.knowledge_revision())?;'
          new_validation = '        validate_knowledge_revision(observation.knowledge_revision())?;'
          if text.count(old_validation) != 1:
              raise SystemExit('cache helper revision validation anchor changed unexpectedly')
          text = text.replace(old_validation, new_validation, 1)
          text += r'''

replace_once(
    "src/vehicle_cache.rs",
    "\nfn validate_text(field: &str, value: &str) -> Result<(), String> {",
    r'''
fn validate_knowledge_revision(value: &str) -> Result<(), String> {
    if !matches!(value.len(), 40 | 64) || !value.bytes().all(|byte| byte.is_ascii_hexdigit()) {
        return Err("vehicle cache knowledge revision is not a full Git object id".into());
    }
    Ok(())
}

fn validate_text(field: &str, value: &str) -> Result<(), String> {''',
)
'''
          path.write_text(text)
          PY
      - run: python3 tools/issue85_cache_patch.py
      - run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.98.0 fmt
      - run: cargo +1.98.0 test --locked
      - run: cargo +1.98.0 clippy --all-targets --locked -- -D warnings
      - run: cargo +1.98.0 build --locked
      - name: Commit generated source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          git diff --cached --exit-code && { echo 'patch produced no changes'; exit 1; } || true
          git commit -m 'Add per-ECU identification cache model'
          git push origin HEAD:feature/85-ecu-identification-cache
