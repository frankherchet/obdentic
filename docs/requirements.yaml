# yaml-language-server: $schema=./requirements.schema.json
version: 1
requirements:
  - id: REQ-001
    title: Support multiple vehicle brands through shared diagnostic layers
    type: functional
    priority: should
    status: draft
    source: "docs/project-goals.md §1: Multi-brand vehicle diagnostics"
    description: >
      OBDentic supports vehicle brands and ECU families through reusable adapter,
      protocol, inventory, knowledge, scheduling, capture, and diagnostic layers.
    acceptance:
      - id: REQ-001.1
        text: The same generic diagnostic flow can expose semantic facts for vehicles from multiple brands or vehicle families.
      - id: REQ-001.2
        text: Adding a vehicle platform does not require a parallel brand-specific adapter, protocol, inventory, scheduling, capture, or diagnostic stack.
      - id: REQ-001.3
        text: Offline fixture validation and real-hardware validation are reported as separate evidence.

  - id: REQ-002
    title: Keep canonical vehicle knowledge separate from private observations
    type: constraint
    priority: must
    status: draft
    source: "docs/project-goals.md §1: Multi-brand vehicle diagnostics; §8: Evidence, provenance and reproducibility"
    description: >
      Reusable vehicle-specific knowledge is versioned and provenance-aware, while
      observations about a concrete vehicle remain private vehicle-local evidence.
    acceptance:
      - id: REQ-002.1
        text: Canonical vehicle knowledge records its version, provenance, confidence, and hardware-validation state.
      - id: REQ-002.2
        text: Private observations about a concrete vehicle are distinguishable from reusable canonical knowledge.
      - id: REQ-002.3
        text: VINs, ECU serial numbers, and raw vehicle captures are not silently promoted into public canonical knowledge.

  - id: REQ-003
    title: Report ECU inventory with evidence and uncertainty preserved
    type: functional
    priority: must
    status: draft
    source: "docs/project-goals.md §2: Automatic ECU inventory and installation list"
    description: >
      The vehicle-local installation inventory combines safe, reproducible evidence
      while keeping installation, reachability, role, and request-target facts distinct.
    acceptance:
      - id: REQ-003.1
        text: Each ECU inventory entry distinguishes configured or installed evidence, observed or reachable evidence, logical role, and diagnostic request target, with provenance for those facts.
      - id: REQ-003.2
        text: A functional OBD responder alone is not reported as proof of ECU role or the complete vehicle installation list.
      - id: REQ-003.3
        text: When no trustworthy platform installation-list mechanism is available, the reported inventory is marked partial.
      - id: REQ-003.4
        text: Discovery does not use blind CAN-address sweeps, arbitrary OEM DID scans, or plausibility-based guessing.

  - id: REQ-004
    title: Support modular Bluetooth adapter backends
    type: functional
    priority: must
    status: draft
    source: "docs/project-goals.md §3: Modular Bluetooth adapter support"
    description: >
      Bluetooth adapter-specific behavior is separated from reusable command
      dialects and vehicle or diagnostic knowledge.
    acceptance:
      - id: REQ-004.1
        text: Adapter discovery, recognition, BLE services and characteristics, connection behavior, identity checks, and hardware quirks are handled by adapter-specific backends.
      - id: REQ-004.2
        text: Reusable ELM-compatible ASCII behavior is represented independently of adapter identity.
      - id: REQ-004.3
        text: Adding another Bluetooth adapter does not require duplicating semantic decoders or changing vehicle-specific knowledge.
      - id: REQ-004.4
        text: Current transport support requirements are limited to Bluetooth; USB and Wi-Fi are outside current product scope.

  - id: REQ-005
    title: Define recording profiles in semantic observation terms
    type: functional
    priority: should
    status: draft
    source: "docs/project-goals.md §4: Recording profiles and long-running evidence capture"
    description: >
      Declarative profiles select semantic observations and requested timing or
      narrow observation policy, subject to subscription and safety policy.
    acceptance:
      - id: REQ-005.1
        text: A recording profile can select semantic facts and request an observation interval without requiring protocol addresses or payloads.
      - id: REQ-005.2
        text: Profiles resolve against effective Vehicle Knowledge and pass through Subscription Policy and Safety Policy before causing transport activity.
      - id: REQ-005.3
        text: Profiles cannot define raw PIDs, DIDs, CAN addresses, UDS payloads, ELM commands, decoder formulas, session or SecurityAccess instructions, mutation switches, or coding, adaptation, or actuator commands.

  - id: REQ-006
    title: Preserve ECU-scoped DTC read evidence
    type: functional
    priority: should
    status: draft
    source: "docs/project-goals.md §5: Diagnostic trouble codes"
    description: >
      DTC access is exposed as bounded semantic diagnostic jobs, and returned
      evidence remains tied to its ECU or responder.
    acceptance:
      - id: REQ-006.1
        text: Each DTC result is associated with its responding ECU or responder and preserves the original diagnostic response.
      - id: REQ-006.2
        text: DTC presence is presented as evidence and is not by itself labeled a component-health verdict.
      - id: REQ-006.3
        text: Manufacturer- or ECU-specific DTC access is exposed only when supported by evidence-backed semantic jobs, without a raw protocol-send interface.

  - id: REQ-007
    title: Keep ordinary operation read-only and raw-command-free
    type: constraint
    priority: must
    status: draft
    source: "docs/project-goals.md §6: Safety model: read-only by default, narrowly gated service mutation; §9: Architectural invariants"
    description: >
      Read-only is the default process capability, and higher-level interfaces
      cannot provide an unrestricted diagnostic command path or elevate it.
    acceptance:
      - id: REQ-007.1
        text: Ordinary CLI, capture, TUI, MCP, and AI-assisted operation cannot mutate the vehicle by default.
      - id: REQ-007.2
        text: Profiles, layouts, MCP calls, AI prompts, and knowledge files cannot change the running process capability.
      - id: REQ-007.3
        text: Higher-level interfaces do not expose arbitrary CAN frames, UDS or OBD services, ELM commands, SecurityAccess, coding, adaptation, actuator tests, ECU reset, RoutineControl, or generic memory or identifier writes.
      - id: REQ-007.4
        text: Capture is passive and cannot initiate vehicle traffic.

  - id: REQ-008
    title: Gate the future DTC-clear capability narrowly at process start
    type: functional
    priority: should
    status: draft
    source: "docs/project-goals.md §6: Safety model: read-only by default, narrowly gated service mutation"
    description: >
      Future DTC clearing is the only intended mutating service capability and is
      available only through an explicitly enabled, closed, reviewed operation.
      This draft describes a future goal and does not assert that DTC clearing is
      currently implemented or available.
    acceptance:
      - id: REQ-008.1
        text: If DTC clearing is implemented, it is unavailable by default and can be enabled only by an explicit process-start capability.
      - id: REQ-008.2
        text: If enabled, clearing is exposed only as a typed DTC-clear job with bounded, known or evidenced target selection and no caller-provided raw service byte, CAN address, UDS payload, or ELM command.
      - id: REQ-008.3
        text: The clearing job preserves original DTC or read evidence before clearing, makes the mutation explicit in capture or audit evidence, and observes the result afterwards where practical.
      - id: REQ-008.4
        text: Enabling DTC clearing does not enable any other mutating operation, and no profile, layout, MCP call, AI prompt, or knowledge file can enable it dynamically.

  - id: REQ-009
    title: Limit AI-assisted diagnostics to semantic interfaces
    type: functional
    priority: should
    status: draft
    source: "docs/project-goals.md §7: AI-assisted diagnostics"
    description: >
      AI agents consume semantic vehicle evidence for reasoning and presentation;
      they do not invent or execute unrestricted protocol traffic.
    acceptance:
      - id: REQ-009.1
        text: An AI agent can inspect inventory, effective semantic facts, captures and snapshots, and request approved semantic reads, read-only jobs, or observation profiles.
      - id: REQ-009.2
        text: AI-assisted diagnosis can explain hypotheses and propose follow-up evidence collection through semantic interfaces.
      - id: REQ-009.3
        text: AI-facing interfaces expose no arbitrary raw CAN, UDS, or ELM commands and cannot elevate the process from read-only mode.
      - id: REQ-009.4
        text: A future process-level DTC-clear capability does not automatically grant that operation to MCP or AI tooling.

  - id: REQ-010
    title: Preserve captures for deterministic offline replay and re-decode
    type: functional
    priority: must
    status: draft
    source: "docs/project-goals.md §4: Recording profiles and long-running evidence capture; §8: Evidence, provenance and reproducibility"
    description: >
      Captures retain original transport evidence and enough context to reproduce
      deterministic protocol normalization and offline vehicle-fact decoding.
    acceptance:
      - id: REQ-010.1
        text: A persisted capture retains raw diagnostic and responder evidence along with request, response, responder, timing, and knowledge provenance needed for offline analysis.
      - id: REQ-010.2
        text: The same persisted capture can be re-decoded offline into deterministic normalized evidence and vehicle facts where the evidence justifies them.
      - id: REQ-010.3
        text: Capture and offline re-decode do not fabricate protocol traffic or replace original evidence.

  - id: REQ-011
    title: Keep ambiguity and knowledge provenance visible
    type: constraint
    priority: must
    status: draft
    source: "docs/project-goals.md §8: Evidence, provenance and reproducibility; §9: Architectural invariants"
    description: >
      Facts and interpretations remain traceable to evidence, and uncertain or
      conflicting evidence is not silently resolved by plausibility.
    acceptance:
      - id: REQ-011.1
        text: Responder evidence is preserved completely, and a response is never selected solely because its decoded value appears more plausible.
      - id: REQ-011.2
        text: Ambiguous evidence remains explicitly ambiguous rather than being guessed away.
      - id: REQ-011.3
        text: Vehicle-specific knowledge retains provenance, confidence, hardware-validation state, and applicable VERIFIED, COMMUNITY, INFERRED, or EXPERIMENTAL classification.
      - id: REQ-011.4
        text: Diagnostic reasoning consumes semantic facts and evidence without creating protocol traffic in the reverse direction.

  - id: REQ-012
    title: Serialize ownership and commands for each physical Bluetooth adapter
    type: constraint
    priority: must
    status: draft
    source: "docs/project-goals.md §9: Architectural invariants"
    description: >
      A single process or session actor owns each physical adapter, and diagnostic
      commands remain sequential unless a reviewed protocol or backend establishes
      safe concurrency.
    acceptance:
      - id: REQ-012.1
        text: At most one process or session actor owns a physical Bluetooth adapter at a time.
      - id: REQ-012.2
        text: Physical diagnostic commands are sequential unless a reviewed protocol or backend establishes safe concurrent operation.
      - id: REQ-012.3
        text: Adapter identity, command dialect, protocol knowledge, Vehicle Knowledge, diagnostic reasoning, and presentation retain separate responsibilities.

  - id: REQ-013
    title: Remember vehicles connected through the Android app
    type: functional
    priority: should
    status: accepted
    source: "Conversation 2026-10-23: Android vehicle selection refinement"
    description: >
      The Android app keeps a private, VIN-keyed record of every real vehicle it
      has connected to, refreshes it on each live connection, and lets the user
      select, rename and delete these records without adapter traffic.
    acceptance:
      - id: REQ-013.1
        text: When the inventory of a live adapter session reads a format-valid VIN that is not stored, the app creates a vehicle record keyed by that VIN with the offline manufacturer hint, observed responders, signal support, engine-target validation state, and first and last connection timestamps.
      - id: REQ-013.2
        text: When a live session reads the VIN of a stored vehicle, the app replaces its responders, signal support, engine-target validation state and last connection timestamp, keeps its name and first connection timestamp, and keeps no history of replaced values.
      - id: REQ-013.3
        text: When the VIN is unreadable or not format-valid, no vehicle record is created, updated or selected, the session continues, and the app shows that the vehicle was not saved because the VIN could not be read.
      - id: REQ-013.4
        text: Demo and replay sessions never create, update or select a vehicle record.
      - id: REQ-013.5
        text: Every tab shows the selected vehicle's name in the header; tapping it opens a vehicle list that shows per record the name, the VIN masked to its first 3 and last 4 characters, the latest odometer value or "nicht verfügbar", and the last connection date, and a record's details show the full VIN.
      - id: REQ-013.6
        text: Selecting a record in the vehicle list sends no adapter traffic, and the selection is restored after the app process restarts.
      - id: REQ-013.7
        text: When a live session reads a VIN other than the selected vehicle's, the app selects the record for the read VIN, creating it if needed, shows "Anderes Fahrzeug erkannt" with that record's name, and leaves the previously selected record unchanged.
      - id: REQ-013.8
        text: A new record is named after its manufacturer hint, or "Fahrzeug" when there is none, followed by the last 4 VIN characters; the user can rename it to 1 to 40 characters after trimming, and an empty name is rejected while the previous name stays.
      - id: REQ-013.9
        text: Deleting a record requires confirmation, permanently removes it from internal storage, clears the selection when it was selected, and leaves recordings unchanged.
      - id: REQ-013.10
        text: Vehicle records live only in app-private storage that is excluded from cloud backup and device transfer, and no app action sends or exports them.
      - id: REQ-013.11
        text: When stored vehicle records cannot be read, live sessions still work, the app shows that the vehicle store is unreadable, never overwrites it implicitly, and replaces it only after an explicitly confirmed reset.
      - id: REQ-013.12
        text: When writing vehicle records fails, the session continues, the app shows that the vehicle could not be saved, and the previously stored records remain intact.

  - id: REQ-014
    title: Reuse a stored vehicle's live selection and last observed support
    type: functional
    priority: should
    status: accepted
    source: "Conversation 2026-10-23: Android vehicle selection refinement"
    description: >
      A selected vehicle record restores its live signal selection and shows its
      last observed signal support before connecting. Stored support is display
      context only and never replaces discovery on a live connection.
    acceptance:
      - id: REQ-014.1
        text: While a vehicle record is selected, a changed live signal selection is stored for that record and is restored, without adapter traffic, whenever that record is selected again.
      - id: REQ-014.2
        text: While no adapter session is active, the signal chooser marks signal support from the selected record's last observation together with its observation date, distinguishable from support observed in a current session.
      - id: REQ-014.3
        text: A live connection always performs full support discovery and inventory; stored support never skips discovery or decides whether a read is sent, and the current observation replaces the stored support.
      - id: REQ-014.4
        text: A newly created record without a stored selection receives the existing default selection of supported signals.

  - id: REQ-015
    title: Read the odometer through the standard OBD PID
    type: functional
    priority: should
    status: accepted
    source: "Conversation 2026-10-23: Android vehicle selection refinement"
    description: >
      On each live connection the odometer is read through standard Mode 01 PID
      0xA6 when the vehicle advertises it and stored with its date and source.
      Manufacturer-specific odometer reads are out of scope until a spike decides them.
    acceptance:
      - id: REQ-015.1
        text: When a live session for a stored vehicle advertises PID 0xA6, the app reads it once after inventory, decodes bytes A to D as (A·2^24 + B·2^16 + C·2^8 + D) / 10 km, and stores the value with its read timestamp and the source "OBD PID A6".
      - id: REQ-015.2
        text: When PID 0xA6 is not advertised, no odometer request is sent, and the record shows its last stored value with that value's date, or "km-Stand nicht verfügbar" when none exists.
      - id: REQ-015.3
        text: When the odometer read fails with NO DATA, a negative response, a timeout or a malformed payload, the stored value and date remain unchanged, the record's details show the failure, and the raw TX/RX remains visible under Debug.
      - id: REQ-015.4
        text: When a newly read odometer value is lower than the stored one, the new value is stored and the record's details show that it is lower than the previous value, naming that value and its date, without correcting either value.

  - id: REQ-016
    title: Read the odometer explicitly from a VW instrument cluster (experimental)
    type: functional
    priority: could
    status: obsolete
    source: "Conversation 2026-10-23: refinement under ADR 0001 (manufacturer-specific odometer source)"
    description: >
      For VW Group vehicles that do not advertise PID 0xA6, the user can start one
      closed, experimental read of the instrument-cluster odometer. Its definition
      comes from canonical Vehicle Knowledge, its result is stored as a separate
      experimental source, and it never escalates to session or security services.
    acceptance:
      - id: REQ-016.1
        text: In a live session whose stored vehicle has a VW Group manufacturer hint, the user-started job sends exactly one ReadDataByIdentifier 0x22 for DID 0x2203 to request target 0x714, accepts only a positive response from responder 0x77E, and for exactly 2 data bytes stores (A·256 + B) · 10 km with its read timestamp and the source "VW Kombiinstrument DID 2203 (experimentell)", separately from the PID 0xA6 value.
      - id: REQ-016.2
        text: The job cannot be started in replay, without an active session, without a stored vehicle, or when the VIN has no VW Group manufacturer hint; the app shows why and sends nothing.
      - id: REQ-016.3
        text: The job sends no service other than 0x22 for DID 0x2203 to 0x714, in particular no session change, SecurityAccess, RoutineControl, retry or other target, and restores functional addressing afterwards.
      - id: REQ-016.4
        text: When there is no response, a response only from other responders, a negative response or a timeout, the job ends without a value, stored values remain unchanged, the record shows the failure including any negative response code, and the raw TX/RX remains visible under Debug and in an active recording.
      - id: REQ-016.5
        text: A positive response with a payload length other than 2 data bytes is kept as raw evidence and shown as "nicht auswertbar", and no odometer value is stored.
      - id: REQ-016.6
        text: The vehicle list shows the PID 0xA6 value when one is stored, otherwise the cluster value marked "Kombiinstrument · experimentell"; the details show both sources separately with their dates and never merge or correct them.
      - id: REQ-016.7
        text: A recorded cluster read re-decodes offline from its raw response to the same result without adapter traffic.
      - id: REQ-016.8
        text: The job's definition and every stored result carry their source, the COMMUNITY classification and the pending hardware validation, and the record's details show them.

  - id: REQ-017
    title: Distribute signed Android test builds through Firebase App Distribution
    type: functional
    priority: should
    status: accepted
    source: "Conversation 2026-10-24: remote Android updates"
    description: >
      Version tags produce a release-signed Android APK that reaches the tester
      through Firebase App Distribution, installs as an update over the previous
      build, and changes neither the app's permissions nor local debug builds.
    acceptance:
      - id: REQ-017.1
        text: Pushing a tag vX.Y.Z on a commit of the default branch builds, after the existing checks pass, a release APK signed with the project release key, with versionName X.Y.Z and versionCode taken from the CI run number, and uploads it to Firebase App Distribution for the configured tester group.
      - id: REQ-017.2
        text: Pull requests, branch pushes and untagged commits never sign or distribute an APK, and signing and Firebase credentials are only available to the tag workflow of the repository itself.
      - id: REQ-017.3
        text: When signing or Firebase credentials are missing or invalid, or a check fails, the workflow fails with a message naming the failed step and distributes nothing; no unsigned or debug-signed APK is ever uploaded.
      - id: REQ-017.4
        text: The release keystore, its passwords and the Firebase service-account key never appear in the repository, build logs or build artifacts.
      - id: REQ-017.5
        text: Local and CI debug builds, lint and acceptance builds work unchanged without any release signing material.
      - id: REQ-017.6
        text: A distributed version installs over the previously distributed version on the test phone as an update, without uninstalling and keeping the app's private data.
      - id: REQ-017.7
        text: The distributed APK contains only the app, not the acceptance test APK, captures or evidence, and declares exactly the permissions of the debug build.

  - id: REQ-018
    title: Export Android recordings to a chosen folder and share them
    type: functional
    priority: must
    status: accepted
    source: "Conversation 2026-10-24: simpler recording export"
    description: >
      The user exports completed recordings with one tap, optionally automatically,
      into a remembered folder, or hands them to the Android share sheet, without
      new app permissions and without moving or changing the internal originals.
    acceptance:
      - id: REQ-018.1
        text: The user chooses an export folder once through the system folder picker, after a notice that recordings can contain VINs, ECU identifiers and mileage; the folder stays chosen across app restarts and is shown on the recordings tab.
      - id: REQ-018.2
        text: "\"Alle exportieren\" copies every completed internal recording that is not yet present in the export folder with the same name and size, skips present ones, and reports the numbers of copied, skipped and failed files."
      - id: REQ-018.3
        text: A recording that is still being written is never exported.
      - id: REQ-018.4
        text: Automatic export is off by default; when the user turns it on, every recording that ends by stop, completion, disconnect or error is copied to the export folder, and the setting stays across app restarts.
      - id: REQ-018.5
        text: "\"Aufnahmen teilen …\" hands all completed recordings to the Android share sheet as read-only content URIs, without adding an app permission."
      - id: REQ-018.6
        text: When the export folder is missing or its permission was revoked, export stops with a message asking to choose the folder again and changes no internal recording; when a copy fails midway, the incomplete target file is removed.
      - id: REQ-018.7
        text: Every exported file is byte-identical to its internal recording, and export never deletes, moves or modifies an internal recording.
      - id: REQ-018.8
        text: The app declares exactly the same permissions as before; neither internet access nor a storage permission is added.

  - id: REQ-019
    title: Pull exported recordings to the computer over adb
    type: functional
    priority: must
    status: accepted
    source: "Conversation 2026-10-24: simpler recording export"
    description: >
      A repository script copies exported recordings from the phone's export folder
      over USB or wireless adb into an untracked evidence directory, read-only on the
      phone, and flags incomplete recordings.
    acceptance:
      - id: REQ-019.1
        text: With exactly one adb device connected over USB or wireless debugging, `tools/pull-recordings.sh` copies every `.jsonl` file from the phone folder `/sdcard/Download/OBDentic` (overridable) into `evidence/phone/` (overridable), skipping files already present there with the same name and size, and prints copied and skipped counts.
      - id: REQ-019.2
        text: The script refuses a destination that is not ignored by git, so recordings can never land in a tracked path.
      - id: REQ-019.3
        text: Each pulled file is reported as complete when its last line is a session_end marker and as partial otherwise; partial files are still kept.
      - id: REQ-019.4
        text: With no device, more than one device, or a missing phone folder, the script exits non-zero with a clear message and writes nothing.
      - id: REQ-019.5
        text: The script only reads from the phone and never writes, deletes or installs anything on it.
      - id: REQ-019.6
        text: With `--report`, the script runs `obdentic-mobile-report` on each newly pulled file and shows its result.

  - id: REQ-020
    title: Connect automatically to the known adapter on start and after connection loss
    type: functional
    priority: must
    status: accepted
    source: "Conversation 2026-10-24: in-car findings (adapter drops at engine start/stop)"
    description: >
      The Android app remembers the last successfully connected adapter and connects
      to it automatically when the app starts and after an unexpected connection loss,
      retrying with pauses until it succeeds or the user stops it. Interrupted
      recordings stay partial and continue in a new recording with the same profile.
    acceptance:
      - id: REQ-020.1
        text: After a successful live connection, the app stores that adapter's address in app-private storage as the known adapter, replacing a previously known one; the address is excluded from backup and never exported.
      - id: REQ-020.2
        text: When the app starts with a known adapter, automatic connection enabled, Bluetooth on and the required permissions granted, it connects to the known adapter without user action and shows the attempt in the status line.
      - id: REQ-020.3
        text: After an unexpected connection loss, the app retries connecting to the known adapter after pauses of 2, 5 and 10 seconds and then every 30 seconds until it succeeds or the user stops it, and shows when the next attempt follows.
      - id: REQ-020.4
        text: "A manual \"Verbindung trennen\", starting the demo or opening a replay stops automatic connection attempts, and none start again until the user connects or the app is started again."
      - id: REQ-020.5
        text: Only the known adapter's exact address is connected automatically; any other discovered device is never connected without user action.
      - id: REQ-020.6
        text: The user can switch automatic connection off and on; it is on by default, and the setting stays across app restarts.
      - id: REQ-020.7
        text: After an automatic connection, only the existing read-only initialization and inventory run automatically, with the normal vehicle-record handling; no other job is repeated.
      - id: REQ-020.8
        text: A recording interrupted by connection loss stays saved as a partial recording; after the automatic reconnection a new recording with the same profile starts automatically, while a test sequence is never restarted automatically.
      - id: REQ-020.9
        text: With Bluetooth off or a required permission missing, no attempt is made, the app shows why, and attempts resume once Bluetooth is on again while the app runs.

  - id: REQ-021
    title: Show immediate pending feedback on state-changing buttons
    type: functional
    priority: should
    status: accepted
    source: "Conversation 2026-10-24: in-car usability (#210)"
    description: >
      Buttons whose action completes asynchronously show at once that the tap was
      received and is in progress, end that state on the result or after a bounded
      time with a clear message, and never start the action twice.
    acceptance:
      - id: REQ-021.1
        text: "Tapping an asynchronous action button (start or stop recording, test run, search, connect, disconnect, Diagnose jobs, export all, automatic export, automatic connection, vehicle select, rename and delete) immediately disables that button, replaces its label with a pending text such as \"Aufzeichnung wird gestartet …\" and shows a progress indicator."
      - id: REQ-021.2
        text: The pending state ends as soon as the action's target state is observed or an error message for it arrives; the button then shows its label for the new state and is usable again.
      - id: REQ-021.3
        text: "When neither the target state nor an error arrives within the action's time limit (connect 30 s, search 15 s, Diagnose jobs 60 s, export 60 s, every other action 10 s), the pending state ends with the message \"Keine Rückmeldung · <Aktion>\", the button becomes usable again, and a late result still updates the displayed state."
      - id: REQ-021.4
        text: Further taps on a button in the pending state start no additional action.
      - id: REQ-021.5
        text: The pending text and the final state are exposed to accessibility services through the button's content description and an announcement.
      - id: REQ-021.6
        text: A pending state stays visible across tab switches and Activity recreation until it ends by REQ-021.2 or REQ-021.3.

  - id: REQ-022
    title: Measure adapter and vehicle read throughput with a closed analysis job
    type: functional
    priority: should
    status: accepted
    source: "Conversation 2026-10-28: adapter throughput question"
    description: >
      A user-started, closed, read-only analysis job measures how fast the adapter
      and vehicle answer standard Mode 01 reads and whether the vehicle answers
      multi-PID Mode 01 requests, records all evidence and shows a summary.
    acceptance:
      - id: REQ-022.1
        text: The job can only be started in a live session that is ready; in demo, replay or without a session it is unavailable with a reason, and no job is started.
      - id: REQ-022.2
        text: The job selects up to 6 Mode 01 PIDs that the vehicle advertises from the catalog, reads each of them 10 times as single requests to the validated engine target, and reports per-PID and overall median and 90th-percentile response time and the achieved reads per second.
      - id: REQ-022.3
        text: The job then sends one Mode 01 request each with 2, 3 and 6 of those PIDs (as many as available), and reports per request whether all requested PIDs were answered, partly answered or rejected, with its response time; it never selects PIDs that are not advertised.
      - id: REQ-022.4
        text: The job sends only Mode 01 requests built from advertised catalog PIDs plus the existing closed target configuration; no caller-provided bytes, no other service and no write or session command are possible.
      - id: REQ-022.5
        text: The job writes its own recording with every TX/RX and the summary; it ends on its own after at most 60 seconds or when the user stops it, and a stop or connection loss leaves a partial recording marked as such.
      - id: REQ-022.6
        text: The summary is shown in the Diagnose tab, and the desktop mobile report re-derives the same statistics offline from the recording without adapter traffic.
      - id: REQ-022.7
        text: Multi-PID responses are decoded per PID with the existing catalog decoders; a missing or malformed PID in the response is reported for that PID and never fills in a value.
  - id: REQ-023
    title: Discover present ECUs from evidence-backed Knowledge targets
    type: functional
    priority: must
    status: accepted
    source: "Conversation 2026-10-28: epic #244, decisions by @frankherchet"
    description: >
      A user-started, closed discovery probes each applicable candidate ECU target
      from the Knowledge DB once with a standard identification read and identifies
      the targets that respond, without blind address sweeps or session changes.
    acceptance:
      - id: REQ-023.1
        text: In a ready live session, the discovery sends exactly one ReadDataByIdentifier 0x22 for DID 0xF187 to each candidate target listed in the pinned Knowledge DB for the vehicle's manufacturer, in the default session, and to no other address.
      - id: REQ-023.2
        text: A positive or negative response from the target's expected response identifier marks that ECU as present with its role and evidence; no response within the timeout marks it as not observed, never as absent.
      - id: REQ-023.3
        text: For each present ECU, the discovery reads the existing standard identification identifiers once each and stores the decoded identity (spare part, software, hardware numbers where answered) in the vehicle record with evidence; negative responses are kept as evidence.
      - id: REQ-023.4
        text: The discovery sends no session change, SecurityAccess, RoutineControl or write service, accepts no caller-provided address or identifier, and restores functional addressing before any later functional request.
      - id: REQ-023.5
        text: The Diagnose tab lists present ECUs with role, address and identity, and shows not-observed targets separately; the result survives app restarts in the vehicle record and is not exported or shared.
      - id: REQ-023.6
        text: The discovery writes its own recording with all TX/RX; replay and the desktop mobile report re-derive the same ECU list offline without adapter traffic.

  - id: REQ-024
    title: Offer Knowledge-defined DID signals of identified ECUs as live signals
    type: functional
    priority: must
    status: accepted
    source: "Conversation 2026-10-28: epic #244, decisions by @frankherchet"
    description: >
      Signals defined in the Knowledge DB for an identified, applicable ECU are
      selectable and polled like standard PIDs, decoded by their Knowledge decoder,
      recorded, replayable and labelled with their validation state.
    acceptance:
      - id: REQ-024.1
        text: When an ECU present in the vehicle record matches a Knowledge definition's applicability, every definition of that ECU without a session requirement becomes a selectable signal with its short name, unit and group.
      - id: REQ-024.2
        text: A selected Knowledge signal is polled through the targeted read path to its ECU target with one request per read and decoded only with its Knowledge decoder; a negative response or malformed payload shows the signal as unavailable and never invents a value.
      - id: REQ-024.3
        text: Every Knowledge signal value shows its validation state; definitions with hardware validation not_validated are labelled "nicht abgeglichen".
      - id: REQ-024.4
        text: Recordings contain the raw request and response of Knowledge signal reads with the Knowledge revision, and replay re-decodes them offline with the same decoder.
      - id: REQ-024.5
        text: Definitions with a session requirement other than the default session are never polled as ordinary live signals; only the explicitly activated, ECU-scoped REQ-027 session may offer them.

  - id: REQ-025
    title: Select live signals in a selector structured by ECU and group
    type: functional
    priority: must
    status: accepted
    source: "Conversation 2026-10-28: epic #244, decisions by @frankherchet"
    description: >
      A full-screen selector replaces the flat signal dialog and organises standard
      and Knowledge signals by ECU and group, with search, limits and presets.
    acceptance:
      - id: REQ-025.1
        text: The selector shows a section for OBD standard signals and one section per present ECU with Knowledge signals, each divided into groups, and lists every selectable signal with short name, unit, support state and validation state.
      - id: REQ-025.2
        text: A search field filters signals across all sections by short name, group and unit.
      - id: REQ-025.3
        text: The selector shows "x / 32 gewählt", refuses a 33rd selection with a visible message, and offers all/none per group within that limit.
      - id: REQ-025.4
        text: The user can save the current selection as a named preset in the vehicle record and apply it later; applying ignores signals that are not selectable for the current vehicle and reports how many were skipped.
      - id: REQ-025.5
        text: The selection cannot be changed while a recording runs, as before.

  - id: REQ-026
    title: Learn which session-flagged DIDs answer in the default session
    type: functional
    priority: should
    status: accepted
    source: "Conversation 2026-10-28: epic #244, decisions by @frankherchet"
    description: >
      A user-started, closed learning run reads each Knowledge DID whose source uses a
      session change once in the default session and records whether it answers,
      without sending any session change.
    acceptance:
      - id: REQ-026.1
        text: In a ready live session with an identified applicable ECU, the learning run sends exactly one 0x22 request per session-flagged definition of that ECU to its target, in the default session, and never sends a session change, SecurityAccess or other service.
      - id: REQ-026.2
        text: Each definition is reported as answered (with the decoded value marked unconfirmed), rejected with its negative response code, or not answered, and the result is stored in the vehicle record and its own recording.
      - id: REQ-026.3
        text: The run is bounded to 120 seconds, can be stopped, keeps a partial recording on stop or connection loss, and its result can be re-derived offline from the recording.
  - id: REQ-027
    title: Read UDS session-flagged DIDs in an explicitly activated extended session
    type: functional
    priority: should
    status: accepted
    source: "ADR 0003, decision by @frankherchet 2026-10-28"
    description: >
      On explicit user action in the Diagnose tab, the app switches one identified ECU
      into the UDS extended diagnostic session, keeps it alive with tester present,
      offers that ECU's session-flagged Knowledge DIDs as UDS-marked read-only signals,
      and always returns to the default session.
    acceptance:
      - id: REQ-027.1
        text: The switch is offered only in a ready live session for an identified ECU with session-flagged Knowledge DIDs; activating it sends exactly 10 03 to that ECU's validated target and shows a persistent "UDS erweiterte Sitzung aktiv" indicator.
      - id: REQ-027.2
        text: While active, tester present 3E 80 is sent to that target at most every 2 seconds and only then; session-flagged DIDs of that ECU become selectable and are marked UDS, distinct from OBD2 signals.
      - id: REQ-027.3
        text: The app sends 10 01 and removes the UDS signals when the user switches off, on disconnect, demo or replay, after 10 minutes, before any functional operation, and on any error; a lost link stops tester present.
      - id: REQ-027.4
        text: In extended session the app sends to the vehicle only 10 03, 10 01, 3E 80 and 0x22 reads of Knowledge-listed DIDs; SecurityAccess, RoutineControl, InputOutputControl, WriteDataByIdentifier, ECUReset, communication or DTC control and caller-provided services, addresses or DIDs are impossible.
      - id: REQ-027.5
        text: A negative response to 10 03 leaves the ECU in the default session, shows the response code and offers no UDS signals; recordings mark the session state of every read and replay re-decodes them offline.

  - id: REQ-028
    title: Record every live session automatically with bounded storage
    type: functional
    priority: must
    status: accepted
    source: "Conversation 2026-10-29: epic #253, decisions by @frankherchet"
    description: >
      Every live session is recorded from its first connection attempt without a button
      press, including the adapter handshake, so evidence exists for every drive. Files
      stay local and rotate to bound crash loss; the app never deletes them on its own;
      named recordings and test sequences keep working as before.
    acceptance:
      - id: REQ-028.1
        text: When the app starts a live connection attempt (manual or automatic) and the setting "Dauer-Aufzeichnung" is on, a recording starts before the first adapter byte is sent, so initialisation, support discovery and inventory TX/RX are in the file, with the vehicle in the header unknown until the recorded inventory result; an attempt that fails still leaves a file with its error marker; demo and replay never start one.
      - id: REQ-028.2
        text: The recording ends with a session_end marker on disconnect, error or user stop, and a reconnect starts a new file; after process death the file stays readable up to at most 5 seconds before the last write.
      - id: REQ-028.3
        text: At 30 minutes of age or 10 MB of size the file is closed with session_end reason "rotated" and a new file with a fresh header continues without a gap in TX/RX; the mobile report treats a rotated file as complete.
      - id: REQ-028.4
        text: Starting a named recording or a test sequence closes the automatic recording and, after that one ends, a new automatic recording continues; named recordings and test sequences behave exactly as before.
      - id: REQ-028.5
        text: The setting is on by default, is shown in the app settings, persists across restarts, and switching it off closes the running automatic recording.
      - id: REQ-028.6
        text: The app never deletes a recording on its own; only an explicit user action (REQ-028.7 or the existing per-recording delete) removes one.
      - id: REQ-028.7
        text: "\"Automatische Aufnahmen löschen\" removes every completed automatic recording after a confirmation and shows the freed size; named recordings, the running recording and exported copies stay untouched."
      - id: REQ-028.8
        text: When the recording cannot be written (storage full or I/O error), the live session continues, the user sees a message, and the recording ends with an error marker where possible; the app does not crash.
      - id: REQ-028.9
        text: Automatic recordings stay in the app-private directory; they are exported, pulled and handled under the same rules as other recordings (REQ-018, REQ-019), and the app adds no permission.
      - id: REQ-028.10
        text: Replay and the desktop mobile report of an automatic recording re-derive the vehicle and signal support from the recorded handshake and inventory events, as they do for named recordings.
