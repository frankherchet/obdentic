# yaml-language-server: $schema=./requirements.schema.json
version: 1
requirements:
  - id: REQ-001
    title: Support multiple vehicle brands through shared diagnostic layers
    type: functional
    priority: should
    status: draft
    source: "docs/project-goals.md §1: Multi-brand vehicle diagnostics"
    description: >
      OBDentic supports vehicle brands and ECU families through reusable adapter,
      protocol, inventory, knowledge, scheduling, capture, and diagnostic layers.
    acceptance:
      - id: REQ-001.1
        text: The same generic diagnostic flow can expose semantic facts for vehicles from multiple brands or vehicle families.
      - id: REQ-001.2
        text: Adding a vehicle platform does not require a parallel brand-specific adapter, protocol, inventory, scheduling, capture, or diagnostic stack.
      - id: REQ-001.3
        text: Offline fixture validation and real-hardware validation are reported as separate evidence.

  - id: REQ-002
    title: Keep canonical vehicle knowledge separate from private observations
    type: constraint
    priority: must
    status: draft
    source: "docs/project-goals.md §1: Multi-brand vehicle diagnostics; §8: Evidence, provenance and reproducibility"
    description: >
      Reusable vehicle-specific knowledge is versioned and provenance-aware, while
      observations about a concrete vehicle remain private vehicle-local evidence.
    acceptance:
      - id: REQ-002.1
        text: Canonical vehicle knowledge records its version, provenance, confidence, and hardware-validation state.
      - id: REQ-002.2
        text: Private observations about a concrete vehicle are distinguishable from reusable canonical knowledge.
      - id: REQ-002.3
        text: VINs, ECU serial numbers, and raw vehicle captures are not silently promoted into public canonical knowledge.

  - id: REQ-003
    title: Report ECU inventory with evidence and uncertainty preserved
    type: functional
    priority: must
    status: draft
    source: "docs/project-goals.md §2: Automatic ECU inventory and installation list"
    description: >
      The vehicle-local installation inventory combines safe, reproducible evidence
      while keeping installation, reachability, role, and request-target facts distinct.
    acceptance:
      - id: REQ-003.1
        text: Each ECU inventory entry distinguishes configured or installed evidence, observed or reachable evidence, logical role, and diagnostic request target, with provenance for those facts.
      - id: REQ-003.2
        text: A functional OBD responder alone is not reported as proof of ECU role or the complete vehicle installation list.
      - id: REQ-003.3
        text: When no trustworthy platform installation-list mechanism is available, the reported inventory is marked partial.
      - id: REQ-003.4
        text: Discovery does not use blind CAN-address sweeps, arbitrary OEM DID scans, or plausibility-based guessing.

  - id: REQ-004
    title: Support modular Bluetooth adapter backends
    type: functional
    priority: must
    status: draft
    source: "docs/project-goals.md §3: Modular Bluetooth adapter support"
    description: >
      Bluetooth adapter-specific behavior is separated from reusable command
      dialects and vehicle or diagnostic knowledge.
    acceptance:
      - id: REQ-004.1
        text: Adapter discovery, recognition, BLE services and characteristics, connection behavior, identity checks, and hardware quirks are handled by adapter-specific backends.
      - id: REQ-004.2
        text: Reusable ELM-compatible ASCII behavior is represented independently of adapter identity.
      - id: REQ-004.3
        text: Adding another Bluetooth adapter does not require duplicating semantic decoders or changing vehicle-specific knowledge.
      - id: REQ-004.4
        text: Current transport support requirements are limited to Bluetooth; USB and Wi-Fi are outside current product scope.

  - id: REQ-005
    title: Define recording profiles in semantic observation terms
    type: functional
    priority: should
    status: draft
    source: "docs/project-goals.md §4: Recording profiles and long-running evidence capture"
    description: >
      Declarative profiles select semantic observations and requested timing or
      narrow observation policy, subject to subscription and safety policy.
    acceptance:
      - id: REQ-005.1
        text: A recording profile can select semantic facts and request an observation interval without requiring protocol addresses or payloads.
      - id: REQ-005.2
        text: Profiles resolve against effective Vehicle Knowledge and pass through Subscription Policy and Safety Policy before causing transport activity.
      - id: REQ-005.3
        text: Profiles cannot define raw PIDs, DIDs, CAN addresses, UDS payloads, ELM commands, decoder formulas, session or SecurityAccess instructions, mutation switches, or coding, adaptation, or actuator commands.

  - id: REQ-006
    title: Preserve ECU-scoped DTC read evidence
    type: functional
    priority: should
    status: draft
    source: "docs/project-goals.md §5: Diagnostic trouble codes"
    description: >
      DTC access is exposed as bounded semantic diagnostic jobs, and returned
      evidence remains tied to its ECU or responder.
    acceptance:
      - id: REQ-006.1
        text: Each DTC result is associated with its responding ECU or responder and preserves the original diagnostic response.
      - id: REQ-006.2
        text: DTC presence is presented as evidence and is not by itself labeled a component-health verdict.
      - id: REQ-006.3
        text: Manufacturer- or ECU-specific DTC access is exposed only when supported by evidence-backed semantic jobs, without a raw protocol-send interface.

  - id: REQ-007
    title: Keep ordinary operation read-only and raw-command-free
    type: constraint
    priority: must
    status: draft
    source: "docs/project-goals.md §6: Safety model: read-only by default, narrowly gated service mutation; §9: Architectural invariants"
    description: >
      Read-only is the default process capability, and higher-level interfaces
      cannot provide an unrestricted diagnostic command path or elevate it.
    acceptance:
      - id: REQ-007.1
        text: Ordinary CLI, capture, TUI, MCP, and AI-assisted operation cannot mutate the vehicle by default.
      - id: REQ-007.2
        text: Profiles, layouts, MCP calls, AI prompts, and knowledge files cannot change the running process capability.
      - id: REQ-007.3
        text: Higher-level interfaces do not expose arbitrary CAN frames, UDS or OBD services, ELM commands, SecurityAccess, coding, adaptation, actuator tests, ECU reset, RoutineControl, or generic memory or identifier writes.
      - id: REQ-007.4
        text: Capture is passive and cannot initiate vehicle traffic.

  - id: REQ-008
    title: Gate the future DTC-clear capability narrowly at process start
    type: functional
    priority: should
    status: draft
    source: "docs/project-goals.md §6: Safety model: read-only by default, narrowly gated service mutation"
    description: >
      Future DTC clearing is the only intended mutating service capability and is
      available only through an explicitly enabled, closed, reviewed operation.
      This draft describes a future goal and does not assert that DTC clearing is
      currently implemented or available.
    acceptance:
      - id: REQ-008.1
        text: If DTC clearing is implemented, it is unavailable by default and can be enabled only by an explicit process-start capability.
      - id: REQ-008.2
        text: If enabled, clearing is exposed only as a typed DTC-clear job with bounded, known or evidenced target selection and no caller-provided raw service byte, CAN address, UDS payload, or ELM command.
      - id: REQ-008.3
        text: The clearing job preserves original DTC or read evidence before clearing, makes the mutation explicit in capture or audit evidence, and observes the result afterwards where practical.
      - id: REQ-008.4
        text: Enabling DTC clearing does not enable any other mutating operation, and no profile, layout, MCP call, AI prompt, or knowledge file can enable it dynamically.

  - id: REQ-009
    title: Limit AI-assisted diagnostics to semantic interfaces
    type: functional
    priority: should
    status: draft
    source: "docs/project-goals.md §7: AI-assisted diagnostics"
    description: >
      AI agents consume semantic vehicle evidence for reasoning and presentation;
      they do not invent or execute unrestricted protocol traffic.
    acceptance:
      - id: REQ-009.1
        text: An AI agent can inspect inventory, effective semantic facts, captures and snapshots, and request approved semantic reads, read-only jobs, or observation profiles.
      - id: REQ-009.2
        text: AI-assisted diagnosis can explain hypotheses and propose follow-up evidence collection through semantic interfaces.
      - id: REQ-009.3
        text: AI-facing interfaces expose no arbitrary raw CAN, UDS, or ELM commands and cannot elevate the process from read-only mode.
      - id: REQ-009.4
        text: A future process-level DTC-clear capability does not automatically grant that operation to MCP or AI tooling.

  - id: REQ-010
    title: Preserve captures for deterministic offline replay and re-decode
    type: functional
    priority: must
    status: draft
    source: "docs/project-goals.md §4: Recording profiles and long-running evidence capture; §8: Evidence, provenance and reproducibility"
    description: >
      Captures retain original transport evidence and enough context to reproduce
      deterministic protocol normalization and offline vehicle-fact decoding.
    acceptance:
      - id: REQ-010.1
        text: A persisted capture retains raw diagnostic and responder evidence along with request, response, responder, timing, and knowledge provenance needed for offline analysis.
      - id: REQ-010.2
        text: The same persisted capture can be re-decoded offline into deterministic normalized evidence and vehicle facts where the evidence justifies them.
      - id: REQ-010.3
        text: Capture and offline re-decode do not fabricate protocol traffic or replace original evidence.

  - id: REQ-011
    title: Keep ambiguity and knowledge provenance visible
    type: constraint
    priority: must
    status: draft
    source: "docs/project-goals.md §8: Evidence, provenance and reproducibility; §9: Architectural invariants"
    description: >
      Facts and interpretations remain traceable to evidence, and uncertain or
      conflicting evidence is not silently resolved by plausibility.
    acceptance:
      - id: REQ-011.1
        text: Responder evidence is preserved completely, and a response is never selected solely because its decoded value appears more plausible.
      - id: REQ-011.2
        text: Ambiguous evidence remains explicitly ambiguous rather than being guessed away.
      - id: REQ-011.3
        text: Vehicle-specific knowledge retains provenance, confidence, hardware-validation state, and applicable VERIFIED, COMMUNITY, INFERRED, or EXPERIMENTAL classification.
      - id: REQ-011.4
        text: Diagnostic reasoning consumes semantic facts and evidence without creating protocol traffic in the reverse direction.

  - id: REQ-012
    title: Serialize ownership and commands for each physical Bluetooth adapter
    type: constraint
    priority: must
    status: draft
    source: "docs/project-goals.md §9: Architectural invariants"
    description: >
      A single process or session actor owns each physical adapter, and diagnostic
      commands remain sequential unless a reviewed protocol or backend establishes
      safe concurrency.
    acceptance:
      - id: REQ-012.1
        text: At most one process or session actor owns a physical Bluetooth adapter at a time.
      - id: REQ-012.2
        text: Physical diagnostic commands are sequential unless a reviewed protocol or backend establishes safe concurrent operation.
      - id: REQ-012.3
        text: Adapter identity, command dialect, protocol knowledge, Vehicle Knowledge, diagnostic reasoning, and presentation retain separate responsibilities.

  - id: REQ-013
    title: Remember vehicles connected through the Android app
    type: functional
    priority: should
    status: accepted
    source: "Conversation 2026-10-23: Android vehicle selection refinement"
    description: >
      The Android app keeps a private, VIN-keyed record of every real vehicle it
      has connected to, refreshes it on each live connection, and lets the user
      select, rename and delete these records without adapter traffic.
    acceptance:
      - id: REQ-013.1
        text: When the inventory of a live adapter session reads a format-valid VIN that is not stored, the app creates a vehicle record keyed by that VIN with the offline manufacturer hint, observed responders, signal support, engine-target validation state, and first and last connection timestamps.
      - id: REQ-013.2
        text: When a live session reads the VIN of a stored vehicle, the app replaces its responders, signal support, engine-target validation state and last connection timestamp, keeps its name and first connection timestamp, and keeps no history of replaced values.
      - id: REQ-013.3
        text: When the VIN is unreadable or not format-valid, no vehicle record is created, updated or selected, the session continues, and the app shows that the vehicle was not saved because the VIN could not be read.
      - id: REQ-013.4
        text: Demo and replay sessions never create, update or select a vehicle record.
      - id: REQ-013.5
        text: Every tab shows the selected vehicle's name in the header; tapping it opens a vehicle list that shows per record the name, the VIN masked to its first 3 and last 4 characters, the latest odometer value or "nicht verfügbar", and the last connection date, and a record's details show the full VIN.
      - id: REQ-013.6
        text: Selecting a record in the vehicle list sends no adapter traffic, and the selection is restored after the app process restarts.
      - id: REQ-013.7
        text: When a live session reads a VIN other than the selected vehicle's, the app selects the record for the read VIN, creating it if needed, shows "Anderes Fahrzeug erkannt" with that record's name, and leaves the previously selected record unchanged.
      - id: REQ-013.8
        text: A new record is named after its manufacturer hint, or "Fahrzeug" when there is none, followed by the last 4 VIN characters; the user can rename it to 1 to 40 characters after trimming, and an empty name is rejected while the previous name stays.
      - id: REQ-013.9
        text: Deleting a record requires confirmation, permanently removes it from internal storage, clears the selection when it was selected, and leaves recordings unchanged.
      - id: REQ-013.10
        text: Vehicle records live only in app-private storage that is excluded from cloud backup and device transfer, and no app action sends or exports them.
      - id: REQ-013.11
        text: When stored vehicle records cannot be read, live sessions still work, the app shows that the vehicle store is unreadable, never overwrites it implicitly, and replaces it only after an explicitly confirmed reset.
      - id: REQ-013.12
        text: When writing vehicle records fails, the session continues, the app shows that the vehicle could not be saved, and the previously stored records remain intact.

  - id: REQ-014
    title: Reuse a stored vehicle's live selection and last observed support
    type: functional
    priority: should
    status: accepted
    source: "Conversation 2026-10-23: Android vehicle selection refinement"
    description: >
      A selected vehicle record restores its live signal selection and shows its
      last observed signal support before connecting. Stored support is display
      context only and never replaces discovery on a live connection.
    acceptance:
      - id: REQ-014.1
        text: While a vehicle record is selected, a changed live signal selection is stored for that record and is restored, without adapter traffic, whenever that record is selected again.
      - id: REQ-014.2
        text: While no adapter session is active, the signal chooser marks signal support from the selected record's last observation together with its observation date, distinguishable from support observed in a current session.
      - id: REQ-014.3
        text: A live connection always performs full support discovery and inventory; stored support never skips discovery or decides whether a read is sent, and the current observation replaces the stored support.
      - id: REQ-014.4
        text: A newly created record without a stored selection receives the existing default selection of supported signals.
      - id: REQ-014.5
        text: A signal whose PID lies in a support page that discovery did not query because the previous answered page's continuation bit is 0 is reported as unsupported in the live inventory, not unknown; a page left unqueried for any other reason stays unknown.

  - id: REQ-015
    title: Read the odometer through the standard OBD PID
    type: functional
    priority: should
    status: accepted
    source: "Conversation 2026-10-23: Android vehicle selection refinement"
    description: >
      On each live connection the odometer is read through standard Mode 01 PID
      0xA6 when the vehicle advertises it and stored with its date and source.
      Manufacturer-specific odometer reads are out of scope until a spike decides them.
    acceptance:
      - id: REQ-015.1
        text: When a live session for a stored vehicle advertises PID 0xA6, the app reads it once after inventory, decodes bytes A to D as (A·2^24 + B·2^16 + C·2^8 + D) / 10 km, and stores the value with its read timestamp and the source "OBD PID A6".
      - id: REQ-015.2
        text: When PID 0xA6 is not advertised, no odometer request is sent, and the record shows its last stored value with that value's date, or "km-Stand nicht verfügbar" when none exists.
      - id: REQ-015.3
        text: When the odometer read fails with NO DATA, a negative response, a timeout or a malformed payload, the stored value and date remain unchanged, the record's details show the failure, and the raw TX/RX remains visible under Debug.
      - id: REQ-015.4
        text: When a newly read odometer value is lower than the stored one, the new value is stored and the record's details show that it is lower than the previous value, naming that value and its date, without correcting either value.

  - id: REQ-016
    title: Read the odometer explicitly from a VW instrument cluster (experimental)
    type: functional
    priority: could
    status: obsolete
    source: "Conversation 2026-10-23: refinement under ADR 0001 (manufacturer-specific odometer source)"
    description: >
      For VW Group vehicles that do not advertise PID 0xA6, the user can start one
      closed, experimental read of the instrument-cluster odometer. Its definition
      comes from canonical Vehicle Knowledge, its result is stored as a separate
      experimental source, and it never escalates to session or security services.
    acceptance:
      - id: REQ-016.1
        text: In a live session whose stored vehicle has a VW Group manufacturer hint, the user-started job sends exactly one ReadDataByIdentifier 0x22 for DID 0x2203 to request target 0x714, accepts only a positive response from responder 0x77E, and for exactly 2 data bytes stores (A·256 + B) · 10 km with its read timestamp and the source "VW Kombiinstrument DID 2203 (experimentell)", separately from the PID 0xA6 value.
      - id: REQ-016.2
        text: The job cannot be started in replay, without an active session, without a stored vehicle, or when the VIN has no VW Group manufacturer hint; the app shows why and sends nothing.
      - id: REQ-016.3
        text: The job sends no service other than 0x22 for DID 0x2203 to 0x714, in particular no session change, SecurityAccess, RoutineControl, retry or other target, and restores functional addressing afterwards.
      - id: REQ-016.4
        text: When there is no response, a response only from other responders, a negative response or a timeout, the job ends without a value, stored values remain unchanged, the record shows the failure including any negative response code, and the raw TX/RX remains visible under Debug and in an active recording.
      - id: REQ-016.5
        text: A positive response with a payload length other than 2 data bytes is kept as raw evidence and shown as "nicht auswertbar", and no odometer value is stored.
      - id: REQ-016.6
        text: The vehicle list shows the PID 0xA6 value when one is stored, otherwise the cluster value marked "Kombiinstrument · experimentell"; the details show both sources separately with their dates and never merge or correct them.
      - id: REQ-016.7
        text: A recorded cluster read re-decodes offline from its raw response to the same result without adapter traffic.
      - id: REQ-016.8
        text: The job's definition and every stored result carry their source, the COMMUNITY classification and the pending hardware validation, and the record's details show them.

  - id: REQ-017
    title: Distribute signed Android test builds through Firebase App Distribution
    type: functional
    priority: should
    status: accepted
    source: "Conversation 2026-10-24: remote Android updates"
    description: >
      Version tags produce a release-signed Android APK that reaches the tester
      through Firebase App Distribution, installs as an update over the previous
      build, and changes neither the app's permissions nor local debug builds.
    acceptance:
      - id: REQ-017.1
        text: Pushing a tag vX.Y.Z on a commit of the default branch builds, after the existing checks pass, a release APK signed with the project release key, with versionName X.Y.Z and versionCode taken from the CI run number, and uploads it to Firebase App Distribution for the configured tester group.
      - id: REQ-017.2
        text: Pull requests, branch pushes and untagged commits never sign or distribute an APK, and signing and Firebase credentials are only available to the tag workflow of the repository itself.
      - id: REQ-017.3
        text: When signing or Firebase credentials are missing or invalid, or a check fails, the workflow fails with a message naming the failed step and distributes nothing; no unsigned or debug-signed APK is ever uploaded.
      - id: REQ-017.4
        text: The release keystore, its passwords and the Firebase service-account key never appear in the repository, build logs or build artifacts.
      - id: REQ-017.5
        text: Local and CI debug builds, lint and acceptance builds work unchanged without any release signing material.
      - id: REQ-017.6
        text: A distributed version installs over the previously distributed version on the test phone as an update, without uninstalling and keeping the app's private data.
      - id: REQ-017.7
        text: The distributed APK contains only the app, not the acceptance test APK, captures or evidence, and declares exactly the permissions of the debug build.

  - id: REQ-018
    title: Export Android recordings to a chosen folder and share them
    type: functional
    priority: must
    status: accepted
    source: "Conversation 2026-10-24: simpler recording export"
    description: >
      The user exports completed recordings with one tap, optionally automatically,
      into a remembered folder, or hands them to the Android share sheet, without
      new app permissions and without moving or changing the internal originals.
    acceptance:
      - id: REQ-018.1
        text: The user chooses an export folder once through the system folder picker, after a notice that recordings can contain VINs, ECU identifiers and mileage; the folder stays chosen across app restarts and is shown on the recordings tab.
      - id: REQ-018.2
        text: "\"Alle exportieren\" copies every completed internal recording that is not yet present in the export folder with the same name and size, skips present ones, and reports the numbers of copied, skipped and failed files."
      - id: REQ-018.3
        text: A recording that is still being written is never exported.
      - id: REQ-018.4
        text: Automatic export is off by default; when the user turns it on, every recording that ends by stop, completion, disconnect or error is copied to the export folder, and the setting stays across app restarts.
      - id: REQ-018.5
        text: "\"Aufnahmen teilen …\" hands all completed recordings to the Android share sheet as read-only content URIs, without adding an app permission."
      - id: REQ-018.6
        text: When the export folder is missing or its permission was revoked, export stops with a message asking to choose the folder again and changes no internal recording; when a copy fails midway, the incomplete target file is removed.
      - id: REQ-018.7
        text: Every exported file is byte-identical to its internal recording, and export never deletes, moves or modifies an internal recording.
      - id: REQ-018.8
        text: The app declares exactly the same permissions as before; neither internet access nor a storage permission is added.
      - id: REQ-018.9
        text: Exporting never runs on the thread that talks to the adapter; while an export copies files, live polling, connection handling and jobs continue without waiting for it.

  - id: REQ-019
    title: Pull exported recordings to the computer over adb
    type: functional
    priority: must
    status: accepted
    source: "Conversation 2026-10-24: simpler recording export"
    description: >
      A repository script copies exported recordings from the phone's export folder
      over USB or wireless adb into an untracked evidence directory, read-only on the
      phone, and flags incomplete recordings.
    acceptance:
      - id: REQ-019.1
        text: With exactly one adb device connected over USB or wireless debugging, `tools/pull-recordings.sh` copies every `.jsonl` file from the phone folder `/sdcard/Download/OBDentic` (overridable) into `evidence/phone/` (overridable), skipping files already present there with the same name and size, and prints copied and skipped counts.
      - id: REQ-019.2
        text: The script refuses a destination that is not ignored by git, so recordings can never land in a tracked path.
      - id: REQ-019.3
        text: Each pulled file is reported as complete when its last line is a session_end marker and as partial otherwise; partial files are still kept.
      - id: REQ-019.4
        text: With no device, more than one device, or a missing phone folder, the script exits non-zero with a clear message and writes nothing.
      - id: REQ-019.5
        text: The script only reads from the phone and never writes, deletes or installs anything on it.
      - id: REQ-019.6
        text: With `--report`, the script runs `obdentic-mobile-report` on each newly pulled file and shows its result.
      - id: REQ-019.7
        text: The import groups timestamped recording and app-log filenames into YYYY-MM-DD subdirectories of the destination using the date in the phone-local filename; files without a usable filename date go into undatiert, and all original filenames and contents remain unchanged.
      - id: REQ-019.8
        text: If an imported filename already exists at the destination with a different size, the old file is retained in a uniquely named conflicts directory before the new copy replaces it; a failed pull leaves the old file intact.

  - id: REQ-020
    title: Connect automatically to the known adapter on start and after connection loss
    type: functional
    priority: must
    status: accepted
    source: "Conversation 2026-10-24: in-car findings (adapter drops at engine start/stop)"
    description: >
      The Android app remembers the last successfully connected adapter and connects
      to it automatically when the app starts and after an unexpected connection loss,
      retrying with pauses until it succeeds or the user stops it. Interrupted
      recordings stay partial and continue in a new recording with the same profile.
    acceptance:
      - id: REQ-020.1
        text: After a successful live connection, the app stores that adapter's address in app-private storage as the known adapter, replacing a previously known one; the address is excluded from backup and never exported.
      - id: REQ-020.2
        text: When the app starts with a known adapter, automatic connection enabled, Bluetooth on and the required permissions granted, it connects to the known adapter without user action and shows the attempt in the status line.
      - id: REQ-020.3
        text: After an unexpected connection loss, the app retries connecting to the known adapter after pauses of 2, 5, 10, 30, 60 and 120 seconds and then every 5 minutes until it succeeds or the user stops it, and shows when the next attempt follows.
      - id: REQ-020.4
        text: "A manual \"Verbindung trennen\", starting the demo or opening a replay stops automatic connection attempts, and none start again until the user connects or the app is started again."
      - id: REQ-020.5
        text: Only the known adapter's exact address is connected automatically; any other discovered device is never connected without user action.
      - id: REQ-020.6
        text: The user can switch automatic connection off and on; it is on by default, and the setting stays across app restarts.
      - id: REQ-020.7
        text: After an automatic connection, only the existing read-only initialization, inventory, ECU identification (REQ-030.7) and, unless switched off, the fault-code scan (REQ-034.1) run automatically, with the normal vehicle-record handling; no other job, in particular no earlier manual job, is repeated.
      - id: REQ-020.8
        text: A recording interrupted by connection loss stays saved as a partial recording; after the automatic reconnection a new recording with the same profile starts automatically, while a test sequence is never restarted automatically.
      - id: REQ-020.9
        text: With Bluetooth off or a required permission missing, no attempt is made, the app shows why, and attempts resume once Bluetooth is on again while the app runs.
      - id: REQ-020.10
        text: When the app comes to the foreground while it waits for the next automatic attempt, that attempt starts immediately and the following pauses start again at 2 seconds.

  - id: REQ-021
    title: Show immediate pending feedback on state-changing buttons
    type: functional
    priority: should
    status: accepted
    source: "Conversation 2026-10-24: in-car usability (#210)"
    description: >
      Buttons whose action completes asynchronously show at once that the tap was
      received and is in progress, end that state on the result or after a bounded
      time with a clear message, and never start the action twice.
    acceptance:
      - id: REQ-021.1
        text: "Tapping an asynchronous action button (start or stop recording, test run, search, connect, disconnect, Diagnose jobs, export all, automatic export, automatic connection, vehicle select, rename and delete) immediately disables that button, replaces its label with a pending text such as \"Aufzeichnung wird gestartet …\" and shows a progress indicator."
      - id: REQ-021.2
        text: The pending state ends as soon as the action's target state is observed or an error message for it arrives; the button then shows its label for the new state and is usable again.
      - id: REQ-021.3
        text: "When neither the target state nor an error arrives within the action's time limit (connect 30 s, search 15 s, Diagnose jobs 60 s, export 60 s, every other action 10 s), the pending state ends with the message \"Keine Rückmeldung · <Aktion>\", the button becomes usable again, and a late result still updates the displayed state."
      - id: REQ-021.4
        text: Further taps on a button in the pending state start no additional action.
      - id: REQ-021.5
        text: The pending text and the final state are exposed to accessibility services through the button's content description and an announcement.
      - id: REQ-021.6
        text: A pending state stays visible across tab switches and Activity recreation until it ends by REQ-021.2 or REQ-021.3.

  - id: REQ-022
    title: Measure adapter and vehicle read throughput with a closed analysis job
    type: functional
    priority: should
    status: accepted
    source: "Conversation 2026-10-28: adapter throughput question"
    description: >
      A user-started, closed, read-only analysis job measures how fast the adapter
      and vehicle answer standard Mode 01 reads and whether the vehicle answers
      multi-PID Mode 01 requests, records all evidence and shows a summary.
    acceptance:
      - id: REQ-022.1
        text: The job can only be started in a live session that is ready; in demo, replay or without a session it is unavailable with a reason, and no job is started.
      - id: REQ-022.2
        text: The job selects up to 6 Mode 01 PIDs that the vehicle advertises from the catalog, reads each of them 10 times as single requests to the validated engine target, and reports per-PID and overall median and 90th-percentile response time and the achieved reads per second.
      - id: REQ-022.3
        text: The job then sends one Mode 01 request each with 2, 3 and 6 of those PIDs (as many as available), and reports per request whether all requested PIDs were answered, partly answered or rejected, with its response time; it never selects PIDs that are not advertised.
      - id: REQ-022.4
        text: The job sends only Mode 01 requests built from advertised catalog PIDs plus the existing closed target configuration; no caller-provided bytes, no other service and no write or session command are possible.
      - id: REQ-022.5
        text: The job writes its own recording with every TX/RX and the summary; it ends on its own after at most 60 seconds or when the user stops it, and a stop or connection loss leaves a partial recording marked as such.
      - id: REQ-022.6
        text: The summary is shown in the Diagnose tab, and the desktop mobile report re-derives the same statistics offline from the recording without adapter traffic.
      - id: REQ-022.7
        text: Multi-PID responses are decoded per PID with the existing catalog decoders; a missing or malformed PID in the response is reported for that PID and never fills in a value.
  - id: REQ-023
    title: Discover present ECUs from evidence-backed Knowledge targets
    type: functional
    priority: must
    status: accepted
    source: "Conversation 2026-10-28: epic #244, decisions by @frankherchet"
    description: >
      A user-started, closed discovery probes each applicable candidate ECU target
      from the Knowledge DB once with a standard identification read and identifies
      the targets that respond, without blind address sweeps or session changes.
    acceptance:
      - id: REQ-023.1
        text: In a ready live session, the discovery sends exactly one ReadDataByIdentifier 0x22 for DID 0xF187 to each candidate target listed in the pinned Knowledge DB for the vehicle's manufacturer, in the default session, and to no other address.
      - id: REQ-023.2
        text: A positive or negative response from the target's expected response identifier marks that ECU as present with its role and evidence; no response within the timeout marks it as not observed, never as absent.
      - id: REQ-023.3
        text: For each present ECU, the discovery reads the existing standard identification identifiers once each and stores the decoded identity (spare part, software, hardware numbers where answered) in the vehicle record with evidence; negative responses are kept as evidence.
      - id: REQ-023.4
        text: The discovery sends no session change, SecurityAccess, RoutineControl or write service, accepts no caller-provided address or identifier, and restores functional addressing before any later functional request.
      - id: REQ-023.5
        text: The Diagnose tab lists present ECUs with role, address and identity, and shows not-observed targets separately; the result survives app restarts in the vehicle record and is not exported or shared.
      - id: REQ-023.6
        text: The discovery writes its own recording with all TX/RX; replay and the desktop mobile report re-derive the same ECU list offline without adapter traffic.
      - id: REQ-023.7
        text: For a standard identification read, a busy response (NRC 0x21, busyRepeatRequest) from the expected responder is intermediate and sends no new request; the last non-busy response from that responder decides the status (positive value as supported, NRC per the existing rules), only busy responses end as negative_response with NRC 0x21, and live and replay classify the same recorded responses identically.
      - id: REQ-023.8
        text: For a standard identification read, a responsePending response (NRC 0x78) from the expected responder is intermediate exactly like a busy response (NRC 0x21); the final response from that responder decides the status (disagreeing final responses are malformed), only responsePending responses end as negative_response with NRC 0x78, and live and replay classify the same recorded responses identically.

  - id: REQ-024
    title: Offer Knowledge-defined DID signals of identified ECUs as live signals
    type: functional
    priority: must
    status: accepted
    source: "Conversation 2026-10-28: epic #244, decisions by @frankherchet"
    description: >
      Signals defined in the Knowledge DB for an identified, applicable ECU are
      selectable and polled like standard PIDs, decoded by their Knowledge decoder,
      recorded, replayable and labelled with their validation state.
    acceptance:
      - id: REQ-024.1
        text: When an ECU present in the vehicle record matches a Knowledge definition's applicability, every definition of that ECU without a session requirement becomes a selectable signal with its short name, unit and group.
      - id: REQ-024.2
        text: A selected Knowledge signal is polled through the targeted read path to its ECU target with one request per read and decoded only with its Knowledge decoder; a negative response or malformed payload shows the signal as unavailable and never invents a value.
      - id: REQ-024.3
        text: Every Knowledge signal value shows its validation state; definitions with hardware validation not_validated are labelled "nicht abgeglichen".
      - id: REQ-024.4
        text: Recordings contain the raw request and response of Knowledge signal reads with the Knowledge revision, and replay re-decodes them offline with the same decoder.
      - id: REQ-024.5
        text: "Definitions with a session requirement other than the default session are never polled as ordinary live signals and their metadata never becomes an ordinary selectable catalog entry before the REQ-027 session is active; only the explicitly activated, ECU-scoped REQ-027 session (by its switch, or by the explicit apply of an OBDentic component preset as in REQ-035.3) may offer them."
      - id: REQ-024.6
        text: Every read result, live or replayed, carries its signal key (the semantic for a standard PID, semantic@target for a Knowledge signal), and live reading, mobile replay, CLI capture replay, the full sweep and obdentic-mobile-report choose the decoder from that key by the same rule, so two signals with the same semantic (different ECUs, or a Knowledge signal sharing a PID's semantic) never overwrite or decode as each other.

  - id: REQ-025
    title: Select live signals in a selector structured by ECU and group
    type: functional
    priority: must
    status: accepted
    source: "Conversation 2026-10-28: epic #244, decisions by @frankherchet"
    description: >
      A full-screen selector replaces the flat signal dialog and organises standard
      and Knowledge signals by ECU and group, with search, limits and presets.
    acceptance:
      - id: REQ-025.1
        text: The selector shows a section for OBD standard signals and one section per present ECU with Knowledge signals, each divided into groups, and lists every selectable signal with short name, unit, support state and validation state.
      - id: REQ-025.2
        text: A search field filters signals across all sections by short name, group and unit.
      - id: REQ-025.3
        text: The selector shows "x / 32 gewählt", refuses a 33rd selection with a visible message, and offers all/none per group within that limit.
      - id: REQ-025.4
        text: The user can save the current selection as a named preset in the vehicle record and apply it later; applying ignores signals that are not selectable for the current vehicle and reports how many were skipped.
      - id: REQ-025.5
        text: The selection cannot be changed while a recording runs, as before.
      - id: REQ-025.6
        text: "\"Preset anwenden\" offers built-in presets - the former recording profiles of the catalog and the five OBDentic component presets of REQ-035, with German names - in every mode except replay and without a vehicle record, followed by the vehicle's own presets in a live session; a built-in preset selects its signals like a stored preset, skipping unsupported ones."
      - id: REQ-025.7
        text: The recordings tab has no recording-profile chooser and no start/stop button; a recording of the Live selection is started with "Gewählte Messwerte aufzeichnen" and stopped with "Aufzeichnung stoppen" on the same button in the Live tab.

  - id: REQ-026
    title: Learn which session-flagged DIDs answer in the default session
    type: functional
    priority: should
    status: accepted
    source: "Conversation 2026-10-28: epic #244, decisions by @frankherchet"
    description: >
      A user-started, closed learning run reads each Knowledge DID whose source uses a
      session change once in the default session and records whether it answers,
      without sending any session change.
    acceptance:
      - id: REQ-026.1
        text: In a ready live session with an identified applicable ECU, the learning run sends exactly one 0x22 request per session-flagged definition of that ECU to its target, in the default session, and never sends a session change, SecurityAccess or other service.
      - id: REQ-026.2
        text: Each definition is reported as answered (with the decoded value marked unconfirmed), rejected with its negative response code, or not answered, and the result is stored in the vehicle record and its own recording.
      - id: REQ-026.3
        text: The run is bounded to 120 seconds, can be stopped, keeps a partial recording on stop or connection loss, and its result can be re-derived offline from the recording.
  - id: REQ-027
    title: Read UDS session-flagged DIDs in an explicitly activated extended session
    type: functional
    priority: should
    status: accepted
    source: "ADR 0003, decision by @frankherchet 2026-10-28"
    description: >
      On explicit user action in the Diagnose tab, the app switches one identified ECU
      into the UDS extended diagnostic session, keeps it alive with tester present,
      offers that ECU's session-flagged Knowledge DIDs as UDS-marked read-only signals,
      polls them together with the user's selected standard Mode 01 PIDs, and always
      returns to the default session.
    acceptance:
      - id: REQ-027.1
        text: "The switch is offered only in a ready live session for an identified ECU with session-flagged Knowledge DIDs; activating it - by the switch or by the explicit apply of an OBDentic component preset (REQ-035.3), and by nothing else - sends exactly 10 03 to that ECU's validated target and shows a persistent \"UDS erweiterte Sitzung aktiv\" indicator."
      - id: REQ-027.2
        text: While active, tester present 3E 80 is sent to that target at most every 2 seconds and only then; session-flagged DIDs of that ECU become selectable and are marked UDS, distinct from OBD2 signals.
      - id: REQ-027.3
        text: The app sends 10 01 (when possible) and removes the UDS signals when the user switches off, on disconnect, demo or replay, 10 minutes after activation, before any other functional operation (DTC read, adapter throughput, session-candidate learning, sweep), before Knowledge reads of another ECU, when the validated engine target is missing or mismatched (without sending a Mode 01 read), and on any error, including a rejected, unanswered or malformed read of either kind; successful selected Mode 01 reads and ordinary Knowledge DID reads of the same engine ECU neither trigger the return nor are paused; a lost link stops tester present.
      - id: REQ-027.4
        text: In extended session the app sends to the vehicle only 10 03, 10 01, 3E 80, 0x22 reads of Knowledge-listed DIDs and 01 xx reads of the user's selected standard PIDs through the existing validated engine target; SecurityAccess, RoutineControl, InputOutputControl, WriteDataByIdentifier, ECUReset, communication or DTC control and caller-provided services, addresses or DIDs are impossible.
      - id: REQ-027.5
        text: A negative response to 10 03 leaves the ECU in the default session, shows the response code and offers no UDS signals; recordings mark the session state of every read and replay re-decodes them offline.
      - id: REQ-027.6
        text: While the session is active, the selected standard Mode 01 PIDs and selected UDS DIDs are polled together; each value is shown with its own outcome (decoded, rejected with its response code, or not answered) and is never filled in or carried over, due tester-present maintenance is attempted between reads, and the recording keeps the raw bytes of both kinds of read with the session state; the indicator and recorded state are the app's view, not ECU-confirmed, because the keepalive reply is suppressed. Successful standard reads keep the session; a rejected, unanswered or malformed read of either kind ends it as in REQ-027.3. When the session ends the OBD2 selection keeps polling and only the UDS signals disappear.
      - id: REQ-027.7
        text: "No profile, layout, stored vehicle preset, Knowledge entry, MCP call, AI prompt, smart analysis (REQ-036), demo, replay, connection or reconnect can activate the session; the only activations are the explicit switch and the explicit apply of a component preset (REQ-035.3), which use this same closed operation with its target, timeout, tester-present, return and error rules and add no service."

  - id: REQ-028
    title: Record every live session automatically with bounded storage
    type: functional
    priority: must
    status: accepted
    source: "Conversation 2026-10-29: epic #253, decisions by @frankherchet"
    description: >
      Every live session is recorded from its first connection attempt without a button
      press, including the adapter handshake, so evidence exists for every drive. Files
      stay local and rotate to bound crash loss; the app never deletes them on its own;
      named recordings and test sequences keep working as before.
    acceptance:
      - id: REQ-028.1
        text: When the app starts a live connection attempt (manual or automatic) and the setting "Dauer-Aufzeichnung" is on, a recording starts before the first adapter byte is sent, so initialisation, support discovery and inventory TX/RX are in the file, with the vehicle in the header unknown until the recorded inventory result; an attempt that fails after the adapter link is up still leaves a file with its error marker (see REQ-028.12); demo and replay never start one.
      - id: REQ-028.2
        text: The recording ends with a session_end marker on disconnect, error or user stop, and a reconnect starts a new file; after process death the file stays readable up to at most 5 seconds before the last write.
      - id: REQ-028.3
        text: At 30 minutes of age or 10 MB of size the file is closed with session_end reason "rotated" and a new file with a fresh header continues without a gap in TX/RX; the mobile report treats a rotated file as complete.
      - id: REQ-028.4
        text: Starting a named recording or a test sequence closes the automatic recording and, after that one ends, a new automatic recording continues; named recordings and test sequences behave exactly as before. Knowledge jobs (ECU identification, availability check, learning) do not close it; their TX/RX and result are written into the running automatic recording.
      - id: REQ-028.5
        text: The setting is on by default, is shown in the app settings, persists across restarts, and switching it off closes the running automatic recording.
      - id: REQ-028.6
        text: The app never deletes a recording on its own; only an explicit user action (REQ-028.7 or the existing per-recording delete) removes one.
      - id: REQ-028.7
        text: "\"Automatische Aufnahmen löschen\" removes every completed automatic recording after a confirmation and shows the freed size; named recordings, the running recording and exported copies stay untouched."
      - id: REQ-028.8
        text: When the recording cannot be written (storage full or I/O error), the live session continues, the user sees a message, and the recording ends with an error marker where possible; the app does not crash.
      - id: REQ-028.9
        text: Automatic recordings stay in the app-private directory; they are exported, pulled and handled under the same rules as other recordings (REQ-018, REQ-019), and the app adds no permission.
      - id: REQ-028.10
        text: Replay and the desktop mobile report of an automatic recording re-derive the vehicle and signal support from the recorded handshake and inventory events, as they do for named recordings.
      - id: REQ-028.11
        text: A button "Jetzt exportieren" next to the continuous-recording switch ends the running automatic file with session_end reason "rotated", continues recording in a new file at once, seals the app log and exports all completed recordings and sealed logs to the export folder; without an export folder it says so and nothing is closed.
      - id: REQ-028.12
        text: An automatic connection attempt that never reaches the adapter (Bluetooth link not established) writes no recording file and seals no app log; the attempt and its error are written to the running app log only.
      - id: REQ-028.13
        text: With thousands of recordings on the phone the recordings tab lists only the newest 30 and states how many older ones are not shown (export and sharing still cover all); opening the tab with 3000 extra recordings takes under 1.5 seconds and the app never stops responding.

  - id: REQ-029
    title: Keep a rolling app debug log separate from vehicle evidence
    type: functional
    priority: must
    status: accepted
    source: "Conversation 2026-10-29: epic #253, decisions by @frankherchet"
    description: >
      The app writes an operational debug log with stack traces, so failures such as an
      unexplained BLE "Java exception was thrown" abort can be diagnosed afterwards.
      It is separate from the replayable vehicle evidence and contains no vehicle
      identifiers or raw adapter traffic.
    acceptance:
      - id: REQ-029.1
        text: The app writes text lines "<ISO-8601 time> <LEVEL> <tag> <message>" to the app-private file logs/app.log and to Logcat; the file is sealed under a unique name logs/app-<yyyyMMdd-HHmmss-SSS>.log when it reaches 1 MB or a connection ends (disconnect, or an error once the adapter link was up), and only the newest 50 sealed files are kept.
      - id: REQ-029.2
        text: The log records service start and stop, every connection attempt with its outcome and reason, reconnect delays, BLE connection, service-discovery and write status codes, diagnostic job start and end with duration and ok flag, and recording start, rotation, end and write failure.
      - id: REQ-029.3
        text: Every logged exception includes its full stack trace with causes; the real cause of a BLE exchange failure is logged where it is thrown, and an uncaught exception on any thread is logged before the process ends.
      - id: REQ-029.4
        text: A log line never contains a 17-character VIN, a raw adapter command or response (six or more hex bytes in a row) or an unmasked Bluetooth address; such content in a message is replaced by a placeholder.
      - id: REQ-029.5
        text: A failure to write the log never raises an exception into the caller and never stops a session.
      - id: REQ-029.6
        text: Each export run (REQ-018.2, REQ-018.4) also copies the sealed log files unchanged under the same skip rules, `tools/pull-recordings.sh` pulls `*.log` files, and the log adds no permission and no dependency.
      - id: REQ-029.7
        text: Every user-visible message of the app, including the reason an action was refused, is also written to the log with the tag "msg"; only the once-per-second countdown to the next automatic attempt is not.
      - id: REQ-029.8
        text: Tester-present cycles (uds.tick) are not logged as jobs; a tick that fails or reports a session error is logged as a warning with the error.

  - id: REQ-030
    title: Measure which default-session Knowledge signals answer in the vehicle
    type: functional
    priority: must
    status: accepted
    source: "Conversation 2026-10-29: epic #253, decisions by @frankherchet"
    description: >
      Availability of UDS DIDs is not advertised, so the app measures it: a bounded,
      read-only job asks each identified ECU once for every default-session Knowledge
      DID, runs automatically for a new vehicle and on every vehicle and ECU survey,
      and stores the result with the vehicle record.
    acceptance:
      - id: REQ-030.1
        text: The job "knowledge.availability" sends exactly one targeted 0x22 read per default-session Knowledge definition of each identified ECU, no session change and, besides the Mode 01 reads of REQ-030.9, no other service, and stops within 90 seconds; a requires-session definition is never read.
      - id: REQ-030.2
        text: Its result lists per signal key the status answered, rejected (with the negative response code) or not_answered (with the reason), plus the Knowledge revision, elapsed time and a truncated flag; a negative response or malformed payload never yields a value.
      - id: REQ-030.3
        text: Without ECU identification the job fails with a message that names the missing step and sends nothing.
      - id: REQ-030.4
        text: In a live session the job starts automatically after ECU identification when the connection created a new vehicle record, and after every "Fahrzeug und Steuergeräte erfassen" job; it does not start in demo or replay, while another job runs, or after a failed inventory.
      - id: REQ-030.5
        text: The job writes all TX/RX into the running automatic recording, or into its own recording when none runs; the result is stored in the vehicle record with date and Knowledge revision, is not exported or shared, and replay of the recording restores the per-signal statuses without adapter traffic.
      - id: REQ-030.6
        text: A truncated or interrupted run keeps the statuses it measured and marks the result as incomplete; losing the link ends the job with an error and stores nothing from it.
      - id: REQ-030.7
        text: In a live session the ECU identification ("ecu.discover") starts automatically after every connection whose inventory identified the vehicle manufacturer, also for a known vehicle, so its Knowledge signals are selectable in that session; for a known vehicle no availability check follows automatically.
      - id: REQ-030.8
        text: For every answered entry the result also carries the raw response and the value and unit decoded with the definition's decoder; when the definition has a plausible_range and the value lies outside it, the entry is flagged implausible with that range; a definition without a range gets no flag, and a decode error is reported on the entry instead of a value.
      - id: REQ-030.9
        text: The same job also reads every catalog Mode 01 PID the vehicle advertises as supported exactly once as a single request to the validated engine target and lists it with the same statuses, value and unit; PIDs reported unsupported or unknown are not sent.
      - id: REQ-030.10
        text: obdentic-mobile-report prints for each availability result in a recording (live or replayed) one table row per entry with key, target, status, NRC or reason, value, unit and the implausible flag, plus counts per status; replay reproduces the same values without adapter traffic.

  - id: REQ-031
    title: Show measured availability in the selector and explain missing values
    type: functional
    priority: must
    status: accepted
    source: "Conversation 2026-10-29: epic #253, decisions by @frankherchet"
    description: >
      The user can select every signal but sees at a glance which ones the vehicle
      delivers, can hide those it does not, and is told why a selected signal has no value.
    acceptance:
      - id: REQ-031.1
        text: The selector shows for every Knowledge signal its measured availability - "antwortet", "lehnt ab (NRC 0x..)", "ohne Antwort" or "ungeprüft" - from the current session's check, else from the vehicle record's stored result labelled with its date; standard PIDs keep their support label.
      - id: REQ-031.2
        text: A checkbox "Nur verfügbare" is on by default and hides standard PIDs the ECU does not report and Knowledge signals measured as rejected or not answered, except signals that are already selected; with it off every signal is listed; unchecked ("ungeprüft") signals are always listed; the selector states how many are hidden.
      - id: REQ-031.3
        text: Every listed signal can be selected regardless of its availability, and the filter never changes the selection or what is polled.
      - id: REQ-031.4
        text: A selected signal that has no value shows "Nicht verfügbar" with its reason on the tile - "nicht unterstützt (Fahrzeug meldet PID nicht)", "lehnt ab · NRC 0x31" or the error/"keine Antwort" - and never a bare dash; the reason is also in the tile's content description.

  - id: REQ-032
    title: Keep the vehicle identification when one VIN read loses a frame
    type: functional
    priority: must
    status: accepted
    source: "Conversation 2026-10-30: vehicle evidence, decisions by @frankherchet"
    description: >
      The adapter can drop one CAN frame of the multi-frame VIN answer. One lost frame
      must not make the app forget which manufacturer it is talking to.
    acceptance:
      - id: REQ-032.1
        text: When the Mode 09 VIN answer of an inventory is a truncated or malformed multi-frame answer, the inventory repeats the read exactly once (a NO DATA or rejected answer is not repeated); a successful repeat yields the same result as a first-time success.
      - id: REQ-032.2
        text: When both reads fail, the inventory reports identity_error and keeps the manufacturer identified earlier in the same connection, so ECU identification still runs; without an earlier identification it fails as before.

  - id: REQ-033
    title: Read the live debug log without scrolling by hand
    type: functional
    priority: should
    status: accepted
    source: "Conversation 2026-10-30, request by @frankherchet"
    description: >
      While testing in the vehicle the user watches the TX/RX log and wants the newest lines in view.
    acceptance:
      - id: REQ-033.1
        text: The debug tab shows the session's TX/RX log as one window at least as tall as the visible screen, without a card or title around it, and after every new line it scrolls so the newest line (bottom) is visible.

  - id: REQ-034
    title: Read the engine fault codes automatically on every connection
    type: functional
    priority: should
    status: accepted
    source: "Conversation 2026-11-13: issue #296, request by @frankherchet"
    description: >
      The driver sees stored and pending engine fault codes without starting a job,
      and every live recording contains them.
    acceptance:
      - id: REQ-034.1
        text: In a live session the read-only fault-code scan ("dtc.scan") starts automatically once after each successful inventory of a connection, also after an automatic reconnect, after the automatic ECU identification and availability jobs of that connection; it does not start in demo or replay, after a failed inventory, or when the setting "Fehlerspeicher beim Verbinden lesen" is off (default on).
      - id: REQ-034.2
        text: The scan reads stored codes (Mode 03) and pending codes (Mode 07) from the engine responders with the existing closed requests and decoder, shows per responder the codes or "keine Fehler", and keeps a negative response, NO DATA or timeout as an explicit result instead of an empty list; it never sends Mode 04 or any other clearing service.
      - id: REQ-034.3
        text: The automatic scan writes its TX/RX into the running automatic recording, and replay of that recording shows the same stored and pending codes without adapter traffic; a failed scan never ends the connection or blocks polling.

  - id: REQ-035
    title: Apply built-in component presets that resolve against the connected vehicle's Knowledge
    type: functional
    priority: should
    status: accepted
    source: "Conversation 2026-11-14: issue #291, decisions by @frankherchet; ADR 0003 amendment 2026-11-14"
    description: >
      A driver or tester applies one of five OBDentic-owned component presets
      (dpf, egr, cooling, turbo, rail) and gets a selection whose signals together
      answer one diagnostic question. Each preset entry is resolved against the
      effective Knowledge of the connected vehicle; entries that cannot be resolved
      are shown as unavailable with a reason, never silently dropped. When an entry
      exists only as a session-flagged DID, the explicit apply may activate the
      existing, bounded REQ-027 session; nothing else can.
    acceptance:
      - id: REQ-035.1
        text: "\"Preset anwenden\" offers exactly five built-in component presets with German names and the OBDentic-owned ids dpf, egr, cooling, turbo and rail, each with 5 to 12 signal entries, under the conditions of REQ-025.6; the entries name only a standard-PID semantic or the original meaning of a Knowledge signal, never a raw command, service byte, address or DID, and Knowledge, profiles, vehicle presets, MCP calls and AI prompts cannot add, change or define a component preset."
      - id: REQ-035.2
        text: "Each entry is resolved against the effective Knowledge of the connected vehicle (identified ECUs, applicable definitions) and the catalog. When a standard PID has the same meaning it is preferred; otherwise a Knowledge signal resolves to the ordinary catalog entry whose semantic field holds its unique signal key (semantic@target) and whose meaning field holds the original semantic, and selection, reading, recording and replay use that key (REQ-024.6). An entry with more than one applicable Knowledge match and no preferred standard PID selects none and is reported as ambiguous, and metadata of session-flagged definitions are not ordinary catalog entries and are neither selectable nor read before the REQ-027 session is active. After applying, every entry shows its own status (selected, not supported by the vehicle, no matching Knowledge, ECU not identified, ambiguous, rejected or not answered per REQ-031, or needs UDS session) and how many entries are available; an unavailable entry is never silently dropped, never shows a value or zero, is not requested from the vehicle, and has its status in its content description."
      - id: REQ-035.3
        text: "Applying selects the available entries like a stored preset (REQ-025.4) within the limit of 32, is refused while a recording runs (REQ-025.5) and in replay, and sends no traffic by itself; only the explicit apply of a component preset in a ready live session, when an entry exists solely as a session-flagged DID of the one ECU for which REQ-027 offers the session (entries of other ECUs stay unavailable), activates the existing REQ-027 session for that ECU once per apply: exactly 10 03 to that ECU's validated target, the persistent indicator, a limit of 10 minutes, tester present at most every 2 seconds, the return rules of REQ-027.3, and no service or read beyond REQ-027.4. It never happens at app start, connection, reconnect, selection restore, on applying a vehicle preset or recording profile, from Knowledge, profile or layout data, MCP or AI, from smart analysis (REQ-036), in demo or replay, or while a job runs, and it is never retried or repeated after an end or expiry."
      - id: REQ-035.4
        text: "When the activation is refused or fails (preconditions not met, negative response with its code, no answer) the preset still selects its default-session entries, marks the UDS entries unavailable with the reason and stays in the default session; when the session ends (user switch-off, expiry after 10 minutes, error, disconnect, other functional operation, another ECU) the UDS entries become unavailable with that reason, 10 01 is sent when possible, the OBD2 selection keeps polling and an unconfirmed return stops operations until reconnection as in REQ-027. A recording marks the applied preset id, the resolution result and status of every entry, the Knowledge revision, that the activation was requested by a preset and the session state of every read, and replay shows the same statuses and values and re-decodes with the pinned decoder without adapter traffic."

  - id: REQ-036
    title: Run a user-started smart analysis that switches component signal sets while driving
    type: functional
    priority: should
    status: accepted
    source: "Conversation 2026-11-14: issue #297, decisions by @frankherchet"
    description: >
      The user starts the smart analysis once; while driving, the app watches
      trigger readings continuously and, in the default session only, switches
      among the five component sets of REQ-035 by priority, bounded windows and
      rotation, so one drive covers several components without phone interaction.
      Every set change is visible and recorded with its time.
    acceptance:
      - id: REQ-036.1
        text: "The smart analysis is started and stopped only by the user in a ready live session, never automatically, after a reconnect or in demo or replay, and is refused with a visible reason while an extended session, a job, a named recording or a test sequence runs. Starting it is one action: it continues the running automatic recording or, when the setting \"Dauer-Aufzeichnung\" is off, starts one itself, and if no recording can be started or written it fails visibly with the reason and does not run; stopping it leaves the user's setting unchanged and ends a recording that was started only for the analysis. It ends on stop, disconnect, error, loss of the recording or the start of such work. It stays in the default session (it never sends 10 03 or another session change and never activates the REQ-027 session), is read-only with at most 32 selected signals through the existing reads of REQ-024 and standard PIDs, treats session-only signals as unavailable, needs no confirmation, dialog or input while driving, and a lost link ends it while the recording stays partial."
      - id: REQ-036.2
        text: "Every set contains the available signals of its component preset plus all available trigger readings - the raw dpf.field_regeneration_request_status, engine coolant temperature, vehicle.accelerator_pedal_e, vehicle speed, engine rpm and engine load - within the limit of 32, so all triggers are evaluated continuously in every set and rotation step. A trigger reading that is unsupported, unavailable, rejected, unanswered or older than 10 seconds is shown as such and the triggers depending on it as not evaluable; such a reading is never treated as 0, as a crossing, as a release or as a condition that holds, does not start, extend or re-arm a window, and ends a window that needs it for its continuing condition (dpf, turbo pressed) with the reason unavailable; evaluation uses only consecutive fresh readings."
      - id: REQ-036.3
        text: "The windows are edge-triggered and bounded. dpf: while the raw dpf.field_regeneration_request_status is other than 0 until the first fresh reading of 0, shown and recorded as \"Regenerationsanforderung (Rohwert)\" and never as a confirmed regeneration. cooling: an upward crossing of 80 °C between two consecutive fresh readings (a first reading at or above 80 is none) starts 10 minutes. turbo: accelerator_pedal_e above 80 % while it lasts and for 20 seconds after the first fresh reading at or below 80 %, pressing again continues it. rail: speed 0, coolant temperature at least 80 °C and rpm 500 to 1100 (inclusive) starts 3 minutes. egr: speed 50 to 80 km/h and engine load 15 to 60 % (inclusive) in consecutive fresh readings for 30 seconds without interruption, then 3 minutes. cooling, rail and egr re-arm only after their condition has become false."
      - id: REQ-036.4
        text: "The priority is dpf > cooling > turbo > rail > egr: the set read is the highest-priority set with a valid window, a higher window interrupts a lower one, windows keep their own time while interrupted, a lower window still valid resumes when the higher ends and an expired one does not. While no window is valid the app rotates through the five sets in that order, 3 minutes each, skipping and reporting sets without an available entry, and after a window ends the rotation continues with a new 3-minute step."
      - id: REQ-036.5
        text: "The Live tab shows the active set, the reason (trigger, rotation, resumption), the remaining time and the latest changes; every set change (start, trigger, interruption, resumption, expiry, rotation, unavailability, stop) is written into the analysis recording with wallclock time, monotonic offset, set, reason, the trigger readings behind it and the time stamps of the reading and the change, continues across the file rotation of REQ-028.3, and replay shows the same changes and readings without adapter traffic; the latency from trigger reading to changed selection depends on the serial adapter and is reported, not promised. The analysis publishes no vehicle evidence: no trigger reading or value ever appears in the operational app log (REQ-029), whose lines for the analysis, including its user-visible messages, name only sets and reasons; trigger values stay in the private recording and in memory, nothing is exported, shared, uploaded, added to the Knowledge or evidence stores or offered to MCP or AI automatically, and its triggers, windows and sets are OBDentic-owned, not Knowledge, profile or vehicle data."

  - id: REQ-037
    title: Show and recover from gaps in live measurement
    type: functional
    priority: should
    status: accepted
    source: "Conversation 2026-11-14: request by @frankherchet"
    description: >
      A driver can distinguish a period without usable live measurements from a
      healthy stream, and the app reduces repeated reads while remaining able to
      recover automatically without assuming why values are missing.
    acceptance:
      - id: REQ-037.1
        text: "In a ready live session, after a selected signal has produced a finite value, if selected reads subsequently fail to produce any finite value for at least 10 seconds while reads are actually attempted, and each currently selected, eligible signal that previously produced a value has been attempted unsuccessfully since the last finite value, the app marks a measurement gap and shows 'Keine aktuellen Messwerte'; it does not claim the ignition is off or that the adapter or vehicle has disconnected. Unsupported, unselected or never-successful signals alone cannot start a gap. Any successful selected OBD or UDS measurement ends the gap and restores normal polling. Errors for individual signals alongside successful measurements do not start a gap."
      - id: REQ-037.2
        text: "While a gap is active the app probes a currently selected signal that previously returned a finite value at most once every 5 seconds, rather than continuing the full polling set; the first finite result ends the gap and restores normal polling. Selection changes, stop, reconnect, failure, jobs, and extended-session keepalive and cleanup remain safe and responsive; no new vehicle operation or background connection is introduced. Missing and stale trigger values remain unknown, never zero or proof that an event did not occur."
      - id: REQ-037.3
        text: "Each recorded gap has a timestamped start and, on recovery or recording stop, an end with only the observed outcome, not an inferred ignition state. An open gap is carried into a rotated file so each part is independently understandable. Offline Android replay and the mobile report show the gap without vehicle traffic, older recordings remain readable, and the raw request and response evidence remains available."

  - id: REQ-038
    title: Track measurement coverage per vehicle and per Smart run without promising a diagnosis
    type: functional
    priority: should
    status: draft
    source: "Conversation 2026-11-14: Smart measurement coverage, decisions by @frankherchet"
    description: |
      While the user-started Smart analysis
      runs, the app keeps a local coverage ledger that says, per vehicle signal and
      per goal context, what was actually measured, for how long, and what could not
      be measured and why. The ledger counts only future readings. It is a statement
      about measurement evidence, never about vehicle health or diagnostic
      completeness. Two ledgers exist: one per Smart run (one Smart start) and one
      per identified vehicle that accumulates across drives and app restarts.

      Counting rules:
      - A qualifying dynamic reading is a decoded finite numeric value of a signal,
        taken in a context whose required context values are all fresh. A reading
        flagged implausible (REQ-030.8) stays visible with a warning and its raw
        evidence is kept, but it is not counted as successful or covered; any later
        clarification of such readings is a separate, versioned definition and never
        credits earlier readings retroactively.
      - A static identity observation is a different kind: a typed ECU identity
        entry of the existing catalog or Knowledge (never an arbitrary value) that
        yields a nonempty valid decoded text or typed value, which may be a string.
        It is observed once per vehicle ledger and needs neither 3 samples nor valid
        measured time. The ledger tracks only the observation and its provenance
        (key, ECU target, time, run, definition versions, reference to the raw
        evidence in the recording) and does not duplicate the possibly sensitive
        value. The exact metadata that classifies an entry as static identity is an
        implementation detail.
      - Valid measured time counts only between two consecutive qualifying readings
        of the same signal in the same context that are at most 10 seconds apart, and
        only the portions in which both neighboring signal readings and all required
        context readings are fresh and qualifying. When a context reading becomes
        stale inside an interval, at most the portion confirmed until its expiry
        counts and the contiguous segment ends at the expiry. A longer gap ends the
        segment and adds no time; time is never bridged across Smart runs or a
        disconnect. Valid segments accumulate across Smart runs and drives in the
        vehicle ledger.
      - Every goal and the generic baseline need at least 3 qualifying samples and at
        least 30 seconds of total valid measured time. Only egr additionally needs
        at least 30 seconds in one contiguous segment; the other goals use cumulative
        time.
      - Progress under an older goal or Knowledge definition stays separate and
        visible and is never silently credited to a newer version; historical data
        is not reprocessed, only new results are recorded under the version in force.
      - Without a confirmed vehicle identity only the run ledger exists. When the
        identity is confirmed during a run, only later observations are credited to
        that vehicle; earlier observations of the run stay session-only.
      - The German user-visible labels are an implementation choice, and no new
        operation to reset a ledger is required.

    depends_on: [REQ-002, REQ-028, REQ-030, REQ-031, REQ-032, REQ-036, REQ-037]
    acceptance:
      - id: REQ-038.1
        text: "While Smart runs the app maintains two coverage ledgers: a run ledger for the current Smart start and, when the vehicle is identified, a vehicle ledger for that vehicle record that accumulates over all Smart runs and drives. Only readings taken after this requirement is in force and after the start of a Smart run are counted; historical readings, existing recordings and the stored results of earlier availability checks are never imported, re-scored or counted. When the vehicle identity is missing or not confirmed, only the run ledger exists, it is shown as session-only, and nothing is attributed to a vehicle record or to another vehicle. When the identity becomes confirmed during a run, only later observations are credited to that vehicle ledger; earlier observations of the run stay session-only."
      - id: REQ-038.2
        text: "Coverage is tracked per signal key (REQ-024.6) and per goal context of REQ-039, so the same signal can be covered in one context and uncovered in another. A qualifying dynamic measurement is a read of the existing closed kinds that yields a decoded finite numeric value that is not flagged implausible, taken while all required context values are fresh. A static identity observation is a typed ECU identity entry of the existing catalog or Knowledge that yields a nonempty valid decoded text or typed value (not necessarily numeric, never an arbitrary value); for it the ledger keeps only the observation and its provenance (key, ECU target, time, run, definition versions, reference to the raw evidence) and does not duplicate the value. Every outcome is kept with the key, context, run, vehicle ledger and session state, and never merged with a different context. A reading flagged implausible (REQ-030.8) is shown with a warning, keeps its raw request and response evidence, and does not count as a successful, qualifying or covered measurement and adds no valid measured time; a later clarification can only be a separate, versioned definition and never credits earlier readings."
      - id: REQ-038.3
        text: "For a signal or context without a defined goal (undefined context) the app reports a generic technical baseline: it is reached when at least 3 qualifying dynamic measurements exist and the total valid measured time (REQ-038.4) is at least 30 seconds, cumulatively over runs and drives; continuity is not required. Time in a measurement gap (REQ-037), time without a qualifying reading, and time during which the signal was unsupported, rejected, unanswered, implausible or session-inaccessible never count. A static identity entry (REQ-038.2) is covered by one observation once per vehicle ledger and needs neither 3 samples nor valid measured time. The baseline is labeled as a technical baseline and is never worded or displayed as diagnostic completeness, health, or a finished diagnosis, also not when every signal reached it."
      - id: REQ-038.4
        text: "Per signal and context the ledger keeps both the total valid measured time, accumulated over drives and Smart runs of the vehicle ledger, and the longest contiguous valid segment. Valid measured time counts only between two consecutive qualifying readings of the same signal in the same context that are at most 10 seconds apart and only for the portions in which both neighboring signal readings and all required context readings are fresh and qualifying; when a context reading becomes stale inside an interval at most the portion confirmed until its expiry counts and the contiguous segment ends at the expiry. A longer gap, an unsupported, rejected, unanswered, empty, implausible or stale reading in between, a session restriction, the end of the Smart run, a disconnect or a reconnect ends the contiguous segment and adds no time, time is never bridged across Smart runs or a disconnect, and a single qualifying reading adds none. Every goal needs at least 3 qualifying samples and at least 30 seconds of total valid time; only the egr goal (REQ-039) additionally needs at least 30 seconds in one contiguous segment and is evaluated on the longest segment, while the other goals use the cumulative time and need no continuity."
      - id: REQ-038.5
        text: "The ledger and display distinguish historical coverage from the latest availability per signal and context. They report not yet observed, observed successfully, unsupported, rejected (with response code), empty, error or no answer (with reason), measurement gap, and session-restricted (with reason) separately. An unavailable or failed reading adds no successful samples or measured time and is never treated as zero; it does not erase earlier valid coverage, which remains visibly distinct from the latest failure."
      - id: REQ-038.6
        text: "The vehicle ledger is stored locally in app-private storage with the vehicle record, survives an app restart and later drives, and is not automatically exported, shared, uploaded, or offered to MCP or AI. An explicitly exported recording may contain the run evidence described in REQ-038.9 under the existing privacy rules. Introducing, migrating or resetting the ledger never deletes or rewrites existing recordings, vehicle records, availability results or other private data; only an explicit user action removes anything (REQ-028.6). Coverage values and vehicle-specific evidence never appear in GitHub issues, docs or the operational app log (REQ-029); the log names only goals, contexts and reasons."
      - id: REQ-038.7
        text: "Every ledger entry records the version of the goal definition (REQ-039) and the Knowledge revision it was measured under. When either changes, progress recorded under the old definition stays separate, visible and labeled with its definition, is never silently credited to or compared with progress under the new version, and is not reprocessed from historical data; only new results are recorded under the version in force when they are taken."
      - id: REQ-038.8
        text: "When the ledger cannot be read, written or migrated, the user sees a message with the reason, coverage is shown as unavailable (not as zero or empty), live measurement and the running recording are not stopped by it, and existing data is left untouched. A ledger that was read incompletely is never overwritten by an empty one."
      - id: REQ-038.9
        text: "The facts needed to rebuild the run ledger - signal key, context, outcome with code or reason, raw evidence reference (for static identity entries only the observation and its provenance, not a duplicated value), wallclock time, monotonic offset, session state, goal and Knowledge definition versions, run identifier and gap and segment boundaries - are written into the running analysis recording (REQ-028, REQ-036.5, REQ-037.3) and continue across file rotation. Replay and the desktop mobile report re-derive the run ledger from the recording without adapter traffic and never change a persisted vehicle ledger; replay stops on a Knowledge-pin mismatch instead of silently using different definitions. Older recordings without these facts stay readable and show no coverage."
      - id: REQ-038.10
        text: "The Live tab or an equivalent screen shows per goal context the covered, partial and not covered counts, the measured time and the longest contiguous segment, the separate states of REQ-038.5 and the label of REQ-038.3, readable without input while driving; numeric trigger values stay in the private recording and in memory."

  - id: REQ-039
    title: Plan Smart measurements automatically by diagnostic context over the whole safely readable catalog
    type: functional
    priority: should
    status: draft
    source: "Conversation 2026-11-14: Smart measurement coverage, decisions by @frankherchet"
    description: |
      After one user start, Smart plans which
      signals to read next so that, over one or several drives, the entire safely
      readable signal catalog of the connected vehicle is measured, each signal in
      the contexts where its reading is meaningful, with repeated measurements per
      context.

      User-approved contextual goal groups:
      - cooling: warm-up and warm driving
      - dpf: warm driving and raw regeneration request
      - turbo: elevated load
      - rail: warm idle
      - egr: steady partial-load driving
      - every safely readable signal: baseline (generic context of REQ-038.3)

      Agreed provisional technical thresholds (user decision 2026-11-14). They are
      OBDentic-owned technical defaults for choosing when to measure, not validated
      clinical or vehicle health conclusions, and the app never claims a fault or a
      healthy vehicle from reaching or missing them:
      - warm: engine coolant temperature at least 80 degC; warm-up below 80 degC is
        recorded as a separate context, and "warm not yet reached" is shown while
        the threshold is not reached.
      - driving: vehicle speed above 0 (cooling and dpf warm driving = warm and
        driving).
      - turbo (elevated load): accelerator pedal position E (vehicle.accelerator_pedal_e)
        above 80 %.
      - rail (warm idle): warm, speed 0 and engine rpm 500 to 1100 inclusive.
      - egr (steady partial-load driving): speed 50 to 80 km/h and engine load 15 to
        60 %, which must persist continuously for at least 30 seconds.
      - dpf raw regeneration request: a fresh reading of the raw
        dpf.field_regeneration_request_status other than 0.
      - target amount: each target and the generic baseline initially need at least 3
        qualifying samples and at least 30 seconds of total valid measured time,
        counted only between consecutive qualifying readings of the same signal and
        context at most 10 seconds apart while all required context values are fresh
        (REQ-038.4); EGR additionally needs at least 30 seconds in one contiguous
        segment. The other contexts use cumulative valid time across runs and drives
        and do not require continuity.

    depends_on: [REQ-025, REQ-030, REQ-031, REQ-035, REQ-036, REQ-038]
    acceptance:
      - id: REQ-039.1
        text: "Smart is started once by the user in a ready live session and then plans, switches and records automatically without any further prompt, dialog or input while driving. It ends on user stop, disconnect, loss of the recording, error or the start of conflicting work."
      - id: REQ-039.2
        text: "The goal contexts cover cooling (warm-up, warm driving), dpf (warm driving, raw regeneration request), turbo (elevated load), rail (warm idle), egr (steady partial-load driving) and a generic baseline for every safely readable signal. Context-specific goals require repeated measurements inside their own condition; measurements outside that condition count only toward the generic baseline of REQ-038.3. The provisional technical conditions are: warm = coolant temperature at least 80 degC (below it is separate warm-up); driving = speed above 0; cooling and dpf warm driving = warm and driving; turbo = accelerator_pedal_e above 80 %; rail = warm, speed 0 and rpm 500 to 1100 inclusive; egr = speed 50 to 80 km/h and engine load 15 to 60 % inclusive, persisting continuously for at least 30 seconds; dpf raw request = a fresh raw dpf.field_regeneration_request_status other than 0. Every goal needs at least 3 qualifying samples and at least 30 seconds of total valid measured time as counted in REQ-038.4; only egr additionally needs 30 seconds in one contiguous segment, the other goals use cumulative time across runs and drives. Once a qualifying EGR interval reaches 30 continuous seconds, its qualifying measurements throughout those 30 seconds count toward the goal; another 30-second interval is not required. Readings flagged implausible are shown with a warning, keep their raw evidence and do not count until clarified. These are technical defaults, not validated health conclusions, and no result is reported as a fault, as healthy or as a diagnosis."
      - id: REQ-039.3
        text: "The planner covers the entire safely readable catalog of the connected vehicle, not only the signals of the five component presets: the standard PIDs the vehicle reports as supported, the default-session signals of the effective Knowledge (REQ-035.2) and, only under REQ-040, the session-flagged DIDs of every eligible ECU, meaning an identified ECU with a validated target and explicit typed Knowledge entries for those DIDs. It uses only closed, validated read and session operations; it adds no write, raw command, caller-provided service byte, arbitrary address or DID, elevated capability or automatic DTC clearing (Mode 04 or any other clearing service), and no caller, profile, vehicle preset, MCP call or AI prompt can add a target."
      - id: REQ-039.4
        text: "The raw dpf.field_regeneration_request_status reading remains in the continuously monitored trigger set whenever readable. When a fresh reading is nonzero, its goal context has the highest planning priority until the existing REQ-036 DPF window ends; every lower-priority goal it interrupts keeps its progress in the ledger and is resumed when the DPF priority ends. The reading is shown and recorded as a raw request status and is never described as confirmed regeneration."
      - id: REQ-039.5
        text: "Within the limit of 32 selected signals per step (REQ-036.1) the planner distributes the catalog over successive steps so every plannable signal is attempted in its context, resumes unfinished work across steps, drives and restarts using the vehicle ledger, and never lets one unavailable signal block other signals or goals."
      - id: REQ-039.6
        text: "Every context condition is evaluated as holds, does not hold, or unknown. A condition whose input reading is unsupported, unavailable, rejected, empty, unanswered, in a gap or older than the maximum age (10 seconds as in REQ-036.2, provisional) is unknown; unknown is never treated as zero, as holding, as not holding, as a crossing or as a release, never starts or extends a measurement toward a context goal, and ends or pauses a continuity segment that needs it. The reason is visible and recorded."
      - id: REQ-039.7
        text: "A signal that is unsupported, rejected, empty, unanswered or session-restricted is reported with its reason in the plan and the ledger (REQ-038.5), is skipped by the planner without a tight retry loop, and the unsuccessful attempt is never counted as a measurement, as 0 or as success. Previously recorded valid coverage is retained. A goal whose required signals are all unavailable is reported as not reachable with the reason, and the other goals continue."
      - id: REQ-039.8
        text: "Plan changes (goal start, interruption, resumption, completion, skip with reason, expiry, stop) are shown with their reason and remaining time and are written into the analysis recording with wallclock time, monotonic offset, goal, reason, the condition readings behind it and the definition versions; replay shows the same without adapter traffic. Condition values stay in the private recording and in memory; the operational app log (REQ-029) names only goals and reasons."
      - id: REQ-039.9
        text: "Diagnostic goals and planning thresholds are owned by OBDentic. Knowledge, profiles, stored vehicle presets, MCP calls and AI prompts cannot alter planning policies or elevate vehicle capabilities."
      - id: REQ-039.10
        text: "The goal, condition and threshold definitions are versioned (REQ-038.7). Changing them or the Knowledge definitions of a vehicle starts a new definition version, never rewrites stored progress and never silently mixes progress between versions."
      - id: REQ-039.11
        text: "Warm-up and driving below the warm threshold of 80 degC are recorded separately from measurements at or above it, in the ledger, recording and display of every warm-dependent goal; until the threshold is reached the goal shows warm not yet reached (cold or warming), not unmet, failed, fault or complete. The 80 degC threshold is a provisional technical default: reaching or missing it, or measuring in either range, is never reported as a fault, as healthy, or as a diagnosis. An unknown coolant reading makes the warm condition unknown (REQ-039.6), not warm and not below."

  - id: REQ-040
    title: Automatically use extended UDS sessions on several validated ECU targets during Smart, only as long as needed
    type: functional
    priority: should
    status: draft
    source: "Conversation 2026-11-14: Smart measurement coverage, decisions by @frankherchet"
    description: |
      The user starts Smart once and Smart may then automatically
      hold and use several extended UDS sessions at the same time, one per distinct
      eligible ECU, without a new prompt. An ECU is eligible when it is identified,
      has a validated target and has explicit typed Knowledge entries for its
      session-flagged DIDs. Smart interleaves the Mode 01 reads and the reads of the
      other ECUs while keeping request, address and response association correct
      and keeping the session and keepalive state per ECU. The project-imposed
      absolute 10 minute limit and the limit of one activation or attempt per Smart
      start are removed: a session is held only as long as unfinished eligible goals
      need it and is closed when no longer needed, with bounded backoff and retry per
      ECU. When the return or session state of one target is uncertain, that ECU is
      isolated and the others continue only if the shared transport, address and
      response association are known to be safe; otherwise all operations stop and
      the app reconnects safely. The app never asserts an ECU's real session state
      and never infers a real ECU timeout.

      A positive response to 10 03 does not prove that the session continues after
      suppressed-response tester present; S3
      timing and gateway behaviour are ECU-specific, and serial requests can block
      beyond deadlines. The app therefore tracks per target the observed state (what
      a response showed) separately from the app-assumed state, schedules due
      maintenance between requests per target, promises no hard timely keepalive,
      and does not treat a session as confirmed when timing or keepalive is
      uncertain. A tester present maintains only its addressed ECU; traffic to
      another target is never relied on to keep a session alive.

    depends_on: [REQ-027, REQ-030, REQ-035, REQ-036, REQ-037, REQ-038, REQ-039]
    acceptance:
      - id: REQ-040.1
        text: "Proposed: Only inside a Smart run started by the user, without a new prompt, dialog or input, Smart activates an extended session for each distinct eligible ECU that has at least one unfinished coverage target readable solely as a session-flagged DID: the ECU is identified, its target is validated, and its session-flagged DIDs are explicit typed Knowledge entries. Several ECUs may hold sessions at the same time. No limit of one activation or attempt per Smart start applies. It never happens at app start, connection, reconnect, demo, replay, in the planner outside a Smart run, or on behalf of any profile, layout, stored vehicle preset, MCP call or AI prompt, and never for an arbitrary address."
      - id: REQ-040.2
        text: "Proposed: Each activation is the closed operation 10 03 to that ECU's validated target; its positive response shows only that the ECU accepted the request at that time. Tester present 3E 80 is addressed to, and maintains only, its own target and is never replaced by traffic to another target. The app schedules due maintenance between requests per target, no more often than every 2 seconds per target (REQ-027.2), and promises no hard timely keepalive because serial requests can block beyond deadlines and S3 timing and gateway behaviour are ECU-specific. Per target it tracks the observed state and the app-assumed state separately; when maintenance is overdue, could not be sent or its timing is uncertain, the session is not treated as confirmed. A persistent indicator names the ECUs whose session the app assumes active. No timer of the app ends a session (the 10 minute limit is removed), and a real ECU timeout is never inferred or asserted."
      - id: REQ-040.3
        text: "Proposed: The app sends to the vehicle only 10 03, 10 01, 3E 80, 0x22 reads of Knowledge-listed DIDs of the ECU that owns them, and 01 xx reads of standard PIDs through the validated engine target, each only to a validated target. No generic write, raw or caller-provided command, service, address or DID, no arbitrary address, no SecurityAccess, RoutineControl, InputOutputControl, WriteDataByIdentifier, ECUReset, communication or DTC control, no elevated capability and no automatic DTC clearing. A session on a non-engine ECU requires explicit typed Knowledge entries and a validated target."
      - id: REQ-040.4
        text: "Proposed: Mode 01 reads and the reads of the several ECUs may be interleaved. Every request is bound to its ECU's validated target; every change of the adapter's addressing (header switching) is tracked, and a response is attributed to a signal only when the current addressing state, the response's source address and its request association establish it. A response or a header switch whose association or outcome cannot be established is attributed to no signal and no ECU, counts toward no coverage, and makes the shared address state uncertain under REQ-040.6. Session and keepalive state is kept per ECU and a read of one ECU never changes or assumes the state of another."
      - id: REQ-040.5
        text: "A session is held only while unfinished eligible goals of that ECU need it. When they are finished or no longer reachable, or Smart ends, the app sends 10 01 to that ECU when possible and removes its session-only signals; OBD2 and default-session reads continue when safe. Unmet preconditions or a definitive negative response to 10 03 prevent activation and mark session-only targets session-restricted with the reason or response code. An unanswered or ambiguous activation never establishes either the default or an extended session: the app attempts bounded cleanup and treats an unconfirmed return under REQ-040.6. Transient failures use bounded retry and backoff per ECU. An ordinary negative response, unsupported signal, invalid payload or NO DATA is not by itself proof that a session ended or that another ECU is affected: the affected signal or target retains its outcome."
      - id: REQ-040.6
        text: "A suppressed-response tester-present is not a confirmed ECU response; the absence of such a response alone is normal and does not isolate the ECU. The app distinguishes an observed session transition from its continuing assumption. If a return to default is unanswered or malformed, a maintenance request cannot be sent or becomes overdue so the session may have expired, or another error makes that target's session status uncertain, the app isolates that ECU: no further reads are sent to it except bounded recovery or close attempts, it is shown as state unconfirmed, and neither default nor extended state is asserted as observed. Reads of other validated targets continue only when the shared adapter, transport, address and response association are known safe. If that shared state is uncertain, the app stops all vehicle operations, ends Smart, shows the reason and reconnects safely."
      - id: REQ-040.7
        text: "Proposed: Smart ends on user stop or disconnect; with it the app sends 10 01 to every target it assumes in a session when possible, tester present stops on a lost link and no vehicle traffic is sent afterwards. Other functional operations, jobs, named recordings and test sequences remain refused while Smart runs (REQ-036.1)."
      - id: REQ-040.8
        text: "Proposed: The recording marks per ECU that a session was requested by Smart, the observed and the app-assumed session state and the target of every read, each activation, retry with its backoff, maintenance, close, isolation and stop with its reason, and the ledger states of REQ-038.5; replay re-decodes them offline without adapter traffic. The indicator and recorded state are the app's view, not ECU-confirmed (REQ-027.6)."
      - id: REQ-040.9
        text: "Proposed: The activation is not described to the user as diagnostic completion, repair or confirmed regeneration. Session-only measurements count toward coverage only as qualifying decoded reads from the ECU that owns them (REQ-038.2), recorded with the observed and the assumed session state; the DPF raw request status remains a raw request value."
      - id: REQ-040.10
        text: "While Smart uses extended sessions, the user can see each target's app-assumed session state, observed state and any uncertainty, refusal or isolation without interacting while driving. These indicators never claim an ECU state that has not been observed."
