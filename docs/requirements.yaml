# yaml-language-server: $schema=./requirements.schema.json
version: 1
requirements:
  - id: REQ-001
    title: Support multiple vehicle brands through shared diagnostic layers
    type: functional
    priority: should
    status: draft
    source: "docs/project-goals.md §1: Multi-brand vehicle diagnostics"
    description: >
      OBDentic supports vehicle brands and ECU families through reusable adapter,
      protocol, inventory, knowledge, scheduling, capture, and diagnostic layers.
    acceptance:
      - id: REQ-001.1
        text: The same generic diagnostic flow can expose semantic facts for vehicles from multiple brands or vehicle families.
      - id: REQ-001.2
        text: Adding a vehicle platform does not require a parallel brand-specific adapter, protocol, inventory, scheduling, capture, or diagnostic stack.
      - id: REQ-001.3
        text: Offline fixture validation and real-hardware validation are reported as separate evidence.

  - id: REQ-002
    title: Keep canonical vehicle knowledge separate from private observations
    type: constraint
    priority: must
    status: draft
    source: "docs/project-goals.md §1: Multi-brand vehicle diagnostics; §8: Evidence, provenance and reproducibility"
    description: >
      Reusable vehicle-specific knowledge is versioned and provenance-aware, while
      observations about a concrete vehicle remain private vehicle-local evidence.
    acceptance:
      - id: REQ-002.1
        text: Canonical vehicle knowledge records its version, provenance, confidence, and hardware-validation state.
      - id: REQ-002.2
        text: Private observations about a concrete vehicle are distinguishable from reusable canonical knowledge.
      - id: REQ-002.3
        text: VINs, ECU serial numbers, and raw vehicle captures are not silently promoted into public canonical knowledge.

  - id: REQ-003
    title: Report ECU inventory with evidence and uncertainty preserved
    type: functional
    priority: must
    status: draft
    source: "docs/project-goals.md §2: Automatic ECU inventory and installation list"
    description: >
      The vehicle-local installation inventory combines safe, reproducible evidence
      while keeping installation, reachability, role, and request-target facts distinct.
    acceptance:
      - id: REQ-003.1
        text: Each ECU inventory entry distinguishes configured or installed evidence, observed or reachable evidence, logical role, and diagnostic request target, with provenance for those facts.
      - id: REQ-003.2
        text: A functional OBD responder alone is not reported as proof of ECU role or the complete vehicle installation list.
      - id: REQ-003.3
        text: When no trustworthy platform installation-list mechanism is available, the reported inventory is marked partial.
      - id: REQ-003.4
        text: Discovery does not use blind CAN-address sweeps, arbitrary OEM DID scans, or plausibility-based guessing.

  - id: REQ-004
    title: Support modular Bluetooth adapter backends
    type: functional
    priority: must
    status: draft
    source: "docs/project-goals.md §3: Modular Bluetooth adapter support"
    description: >
      Bluetooth adapter-specific behavior is separated from reusable command
      dialects and vehicle or diagnostic knowledge.
    acceptance:
      - id: REQ-004.1
        text: Adapter discovery, recognition, BLE services and characteristics, connection behavior, identity checks, and hardware quirks are handled by adapter-specific backends.
      - id: REQ-004.2
        text: Reusable ELM-compatible ASCII behavior is represented independently of adapter identity.
      - id: REQ-004.3
        text: Adding another Bluetooth adapter does not require duplicating semantic decoders or changing vehicle-specific knowledge.
      - id: REQ-004.4
        text: Current transport support requirements are limited to Bluetooth; USB and Wi-Fi are outside current product scope.

  - id: REQ-005
    title: Define recording profiles in semantic observation terms
    type: functional
    priority: should
    status: draft
    source: "docs/project-goals.md §4: Recording profiles and long-running evidence capture"
    description: >
      Declarative profiles select semantic observations and requested timing or
      narrow observation policy, subject to subscription and safety policy.
    acceptance:
      - id: REQ-005.1
        text: A recording profile can select semantic facts and request an observation interval without requiring protocol addresses or payloads.
      - id: REQ-005.2
        text: Profiles resolve against effective Vehicle Knowledge and pass through Subscription Policy and Safety Policy before causing transport activity.
      - id: REQ-005.3
        text: Profiles cannot define raw PIDs, DIDs, CAN addresses, UDS payloads, ELM commands, decoder formulas, session or SecurityAccess instructions, mutation switches, or coding, adaptation, or actuator commands.

  - id: REQ-006
    title: Preserve ECU-scoped DTC read evidence
    type: functional
    priority: should
    status: draft
    source: "docs/project-goals.md §5: Diagnostic trouble codes"
    description: >
      DTC access is exposed as bounded semantic diagnostic jobs, and returned
      evidence remains tied to its ECU or responder.
    acceptance:
      - id: REQ-006.1
        text: Each DTC result is associated with its responding ECU or responder and preserves the original diagnostic response.
      - id: REQ-006.2
        text: DTC presence is presented as evidence and is not by itself labeled a component-health verdict.
      - id: REQ-006.3
        text: Manufacturer- or ECU-specific DTC access is exposed only when supported by evidence-backed semantic jobs, without a raw protocol-send interface.

  - id: REQ-007
    title: Keep ordinary operation read-only and raw-command-free
    type: constraint
    priority: must
    status: draft
    source: "docs/project-goals.md §6: Safety model: read-only by default, narrowly gated service mutation; §9: Architectural invariants"
    description: >
      Read-only is the default process capability, and higher-level interfaces
      cannot provide an unrestricted diagnostic command path or elevate it.
    acceptance:
      - id: REQ-007.1
        text: Ordinary CLI, capture, TUI, MCP, and AI-assisted operation cannot mutate the vehicle by default.
      - id: REQ-007.2
        text: Profiles, layouts, MCP calls, AI prompts, and knowledge files cannot change the running process capability.
      - id: REQ-007.3
        text: Higher-level interfaces do not expose arbitrary CAN frames, UDS or OBD services, ELM commands, SecurityAccess, coding, adaptation, actuator tests, ECU reset, RoutineControl, or generic memory or identifier writes.
      - id: REQ-007.4
        text: Capture is passive and cannot initiate vehicle traffic.

  - id: REQ-008
    title: Gate the future DTC-clear capability narrowly at process start
    type: functional
    priority: should
    status: draft
    source: "docs/project-goals.md §6: Safety model: read-only by default, narrowly gated service mutation"
    description: >
      Future DTC clearing is the only intended mutating service capability and is
      available only through an explicitly enabled, closed, reviewed operation.
      This draft describes a future goal and does not assert that DTC clearing is
      currently implemented or available.
    acceptance:
      - id: REQ-008.1
        text: If DTC clearing is implemented, it is unavailable by default and can be enabled only by an explicit process-start capability.
      - id: REQ-008.2
        text: If enabled, clearing is exposed only as a typed DTC-clear job with bounded, known or evidenced target selection and no caller-provided raw service byte, CAN address, UDS payload, or ELM command.
      - id: REQ-008.3
        text: The clearing job preserves original DTC or read evidence before clearing, makes the mutation explicit in capture or audit evidence, and observes the result afterwards where practical.
      - id: REQ-008.4
        text: Enabling DTC clearing does not enable any other mutating operation, and no profile, layout, MCP call, AI prompt, or knowledge file can enable it dynamically.

  - id: REQ-009
    title: Limit AI-assisted diagnostics to semantic interfaces
    type: functional
    priority: should
    status: draft
    source: "docs/project-goals.md §7: AI-assisted diagnostics"
    description: >
      AI agents consume semantic vehicle evidence for reasoning and presentation;
      they do not invent or execute unrestricted protocol traffic.
    acceptance:
      - id: REQ-009.1
        text: An AI agent can inspect inventory, effective semantic facts, captures and snapshots, and request approved semantic reads, read-only jobs, or observation profiles.
      - id: REQ-009.2
        text: AI-assisted diagnosis can explain hypotheses and propose follow-up evidence collection through semantic interfaces.
      - id: REQ-009.3
        text: AI-facing interfaces expose no arbitrary raw CAN, UDS, or ELM commands and cannot elevate the process from read-only mode.
      - id: REQ-009.4
        text: A future process-level DTC-clear capability does not automatically grant that operation to MCP or AI tooling.

  - id: REQ-010
    title: Preserve captures for deterministic offline replay and re-decode
    type: functional
    priority: must
    status: draft
    source: "docs/project-goals.md §4: Recording profiles and long-running evidence capture; §8: Evidence, provenance and reproducibility"
    description: >
      Captures retain original transport evidence and enough context to reproduce
      deterministic protocol normalization and offline vehicle-fact decoding.
    acceptance:
      - id: REQ-010.1
        text: A persisted capture retains raw diagnostic and responder evidence along with request, response, responder, timing, and knowledge provenance needed for offline analysis.
      - id: REQ-010.2
        text: The same persisted capture can be re-decoded offline into deterministic normalized evidence and vehicle facts where the evidence justifies them.
      - id: REQ-010.3
        text: Capture and offline re-decode do not fabricate protocol traffic or replace original evidence.

  - id: REQ-011
    title: Keep ambiguity and knowledge provenance visible
    type: constraint
    priority: must
    status: draft
    source: "docs/project-goals.md §8: Evidence, provenance and reproducibility; §9: Architectural invariants"
    description: >
      Facts and interpretations remain traceable to evidence, and uncertain or
      conflicting evidence is not silently resolved by plausibility.
    acceptance:
      - id: REQ-011.1
        text: Responder evidence is preserved completely, and a response is never selected solely because its decoded value appears more plausible.
      - id: REQ-011.2
        text: Ambiguous evidence remains explicitly ambiguous rather than being guessed away.
      - id: REQ-011.3
        text: Vehicle-specific knowledge retains provenance, confidence, hardware-validation state, and applicable VERIFIED, COMMUNITY, INFERRED, or EXPERIMENTAL classification.
      - id: REQ-011.4
        text: Diagnostic reasoning consumes semantic facts and evidence without creating protocol traffic in the reverse direction.

  - id: REQ-012
    title: Serialize ownership and commands for each physical Bluetooth adapter
    type: constraint
    priority: must
    status: draft
    source: "docs/project-goals.md §9: Architectural invariants"
    description: >
      A single process or session actor owns each physical adapter, and diagnostic
      commands remain sequential unless a reviewed protocol or backend establishes
      safe concurrency.
    acceptance:
      - id: REQ-012.1
        text: At most one process or session actor owns a physical Bluetooth adapter at a time.
      - id: REQ-012.2
        text: Physical diagnostic commands are sequential unless a reviewed protocol or backend establishes safe concurrent operation.
      - id: REQ-012.3
        text: Adapter identity, command dialect, protocol knowledge, Vehicle Knowledge, diagnostic reasoning, and presentation retain separate responsibilities.

  - id: REQ-013
    title: Remember vehicles connected through the Android app
    type: functional
    priority: should
    status: accepted
    source: "Conversation 2026-10-23: Android vehicle selection refinement"
    description: >
      The Android app keeps a private, VIN-keyed record of every real vehicle it
      has connected to, refreshes it on each live connection, and lets the user
      select, rename and delete these records without adapter traffic.
    acceptance:
      - id: REQ-013.1
        text: When the inventory of a live adapter session reads a format-valid VIN that is not stored, the app creates a vehicle record keyed by that VIN with the offline manufacturer hint, observed responders, signal support, engine-target validation state, and first and last connection timestamps.
      - id: REQ-013.2
        text: When a live session reads the VIN of a stored vehicle, the app replaces its responders, signal support, engine-target validation state and last connection timestamp, keeps its name and first connection timestamp, and keeps no history of replaced values.
      - id: REQ-013.3
        text: When the VIN is unreadable or not format-valid, no vehicle record is created, updated or selected, the session continues, and the app shows that the vehicle was not saved because the VIN could not be read.
      - id: REQ-013.4
        text: Demo and replay sessions never create, update or select a vehicle record.
      - id: REQ-013.5
        text: Every tab shows the selected vehicle's name in the header; tapping it opens a vehicle list that shows per record the name, the VIN masked to its first 3 and last 4 characters, the latest odometer value or "nicht verfügbar", and the last connection date, and a record's details show the full VIN.
      - id: REQ-013.6
        text: Selecting a record in the vehicle list sends no adapter traffic, and the selection is restored after the app process restarts.
      - id: REQ-013.7
        text: When a live session reads a VIN other than the selected vehicle's, the app selects the record for the read VIN, creating it if needed, shows "Anderes Fahrzeug erkannt" with that record's name, and leaves the previously selected record unchanged.
      - id: REQ-013.8
        text: A new record is named after its manufacturer hint, or "Fahrzeug" when there is none, followed by the last 4 VIN characters; the user can rename it to 1 to 40 characters after trimming, and an empty name is rejected while the previous name stays.
      - id: REQ-013.9
        text: Deleting a record requires confirmation, permanently removes it from internal storage, clears the selection when it was selected, and leaves recordings unchanged.
      - id: REQ-013.10
        text: Vehicle records live only in app-private storage that is excluded from cloud backup and device transfer, and no app action sends or exports them.
      - id: REQ-013.11
        text: When stored vehicle records cannot be read, live sessions still work, the app shows that the vehicle store is unreadable, never overwrites it implicitly, and replaces it only after an explicitly confirmed reset.
      - id: REQ-013.12
        text: When writing vehicle records fails, the session continues, the app shows that the vehicle could not be saved, and the previously stored records remain intact.

  - id: REQ-014
    title: Reuse a stored vehicle's live selection and last observed support
    type: functional
    priority: should
    status: accepted
    source: "Conversation 2026-10-23: Android vehicle selection refinement"
    description: >
      A selected vehicle record restores its live signal selection and shows its
      last observed signal support before connecting. Stored support is display
      context only and never replaces discovery on a live connection.
    acceptance:
      - id: REQ-014.1
        text: While a vehicle record is selected, a changed live signal selection is stored for that record and is restored, without adapter traffic, whenever that record is selected again.
      - id: REQ-014.2
        text: While no adapter session is active, the signal chooser marks signal support from the selected record's last observation together with its observation date, distinguishable from support observed in a current session.
      - id: REQ-014.3
        text: A live connection always performs full support discovery and inventory; stored support never skips discovery or decides whether a read is sent, and the current observation replaces the stored support.
      - id: REQ-014.4
        text: A newly created record without a stored selection receives the existing default selection of supported signals.

  - id: REQ-015
    title: Read the odometer through the standard OBD PID
    type: functional
    priority: should
    status: accepted
    source: "Conversation 2026-10-23: Android vehicle selection refinement"
    description: >
      On each live connection the odometer is read through standard Mode 01 PID
      0xA6 when the vehicle advertises it and stored with its date and source.
      Manufacturer-specific odometer reads are out of scope until a spike decides them.
    acceptance:
      - id: REQ-015.1
        text: When a live session for a stored vehicle advertises PID 0xA6, the app reads it once after inventory, decodes bytes A to D as (A·2^24 + B·2^16 + C·2^8 + D) / 10 km, and stores the value with its read timestamp and the source "OBD PID A6".
      - id: REQ-015.2
        text: When PID 0xA6 is not advertised, no odometer request is sent, and the record shows its last stored value with that value's date, or "km-Stand nicht verfügbar" when none exists.
      - id: REQ-015.3
        text: When the odometer read fails with NO DATA, a negative response, a timeout or a malformed payload, the stored value and date remain unchanged, the record's details show the failure, and the raw TX/RX remains visible under Debug.
      - id: REQ-015.4
        text: When a newly read odometer value is lower than the stored one, the new value is stored and the record's details show that it is lower than the previous value, naming that value and its date, without correcting either value.

  - id: REQ-016
    title: Read the odometer explicitly from a VW instrument cluster (experimental)
    type: functional
    priority: could
    status: accepted
    source: "Conversation 2026-10-23: refinement under ADR 0001 (manufacturer-specific odometer source)"
    description: >
      For VW Group vehicles that do not advertise PID 0xA6, the user can start one
      closed, experimental read of the instrument-cluster odometer. Its definition
      comes from canonical Vehicle Knowledge, its result is stored as a separate
      experimental source, and it never escalates to session or security services.
    acceptance:
      - id: REQ-016.1
        text: In a live session whose stored vehicle has a VW Group manufacturer hint, the user-started job sends exactly one ReadDataByIdentifier 0x22 for DID 0x2203 to request target 0x714, accepts only a positive response from responder 0x77E, and for exactly 2 data bytes stores (A·256 + B) · 10 km with its read timestamp and the source "VW Kombiinstrument DID 2203 (experimentell)", separately from the PID 0xA6 value.
      - id: REQ-016.2
        text: The job cannot be started in replay, without an active session, without a stored vehicle, or when the VIN has no VW Group manufacturer hint; the app shows why and sends nothing.
      - id: REQ-016.3
        text: The job sends no service other than 0x22 for DID 0x2203 to 0x714, in particular no session change, SecurityAccess, RoutineControl, retry or other target, and restores functional addressing afterwards.
      - id: REQ-016.4
        text: When there is no response, a response only from other responders, a negative response or a timeout, the job ends without a value, stored values remain unchanged, the record shows the failure including any negative response code, and the raw TX/RX remains visible under Debug and in an active recording.
      - id: REQ-016.5
        text: A positive response with a payload length other than 2 data bytes is kept as raw evidence and shown as "nicht auswertbar", and no odometer value is stored.
      - id: REQ-016.6
        text: The vehicle list shows the PID 0xA6 value when one is stored, otherwise the cluster value marked "Kombiinstrument · experimentell"; the details show both sources separately with their dates and never merge or correct them.
      - id: REQ-016.7
        text: A recorded cluster read re-decodes offline from its raw response to the same result without adapter traffic.
      - id: REQ-016.8
        text: The job's definition and every stored result carry their source, the COMMUNITY classification and the pending hardware validation, and the record's details show them.
